<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Combat Mat — D&D Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
:root { --amber:#c8922a; --amber-lt:#f0c060; --amber-dim:rgba(200,146,42,0.2); --cs:44px; --view:880px; --panel:rgba(8,6,4,0.97); --border:rgba(200,146,42,0.22); }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#141414; overflow:hidden; width:100vw; height:100vh; font-family:'EB Garamond',serif; display:flex; align-items:center; justify-content:center; }
#app { display:flex; align-items:stretch; gap:0; box-shadow:0 0 60px rgba(0,0,0,0.8); }
#grid-wrap { position:relative; flex-shrink:0; }
#grid { position:relative; box-sizing:content-box; overflow:hidden; width:var(--view); height:var(--view); border:2px solid var(--amber); border-left:none; border-right:none; }
#grid { cursor:grab; }
#grid.panning { cursor:grabbing; }
#grid.painting { cursor:crosshair; }
/* Mapa del mundo: tapa el mat (por debajo de los dados), local por cliente */
#world-map { position:absolute; top:2px; left:0; width:var(--view); height:var(--view); z-index:35; background:#0a0805 url('mapa.jpg') center/contain no-repeat; display:none; cursor:grab; overflow:hidden; }
#world-map.panning { cursor:grabbing; }
body.show-map #world-map { display:block; }
body.show-map #arrow-svg { display:none; }
.scene-row { display:flex; gap:4px; align-items:stretch; }
.scene-row #scene-select { flex:1; min-width:0; }
#map-toggle { flex-shrink:0; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:rgba(255,255,255,0.45); border-radius:4px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:.5px; text-transform:uppercase; padding:0 7px; cursor:pointer; }
#map-toggle:hover { color:rgba(255,255,255,0.75); }
#map-toggle.on { background:rgba(200,146,42,0.18); border-color:var(--amber); color:var(--amber-lt); }
/* --n = casillas por lado que ocupa la ficha (Grande 2, Enorme 3, Gargantuesco 4); --b = tamaño del cuerpo en casillas (Diminuto 0.5) */
.token { position:absolute; width:calc(var(--cs)*var(--n,1)); height:calc(var(--cs)*var(--n,1)); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; user-select:none; z-index:var(--z,10); transform-origin:50% 90%; }
/* Varias fichas en la misma celda: abanico tipo mano de cartas (layoutStacks). Solo el cuerpo recibe el mouse,
   así la franja visible de cada ficha de abajo sigue siendo clickeable */
.token.stacked, .token.tok-tiny { pointer-events:none; }
.token.stacked .tbody, .token.tok-tiny .tbody { pointer-events:auto; }
.token:hover { filter:brightness(1.35); z-index:20; }
.token.selected { z-index:30; }
.token.dragging { cursor:grabbing; z-index:100; opacity:.85; }
body.tok-dragging, body.tok-dragging * { cursor:none !important; }
/* Ficha = 9/11 de la celda (36px a 44px), escala con el nivel de zoom */
.tbody { width:calc(var(--cs)*var(--b,1)*9/11); height:calc(var(--cs)*var(--b,1)*9/11); display:flex; align-items:center; justify-content:center; font-size:calc(var(--cs)*var(--b,1)*4/11); position:relative; }
.token-player .tbody { border-radius:50%; border:2px solid; }
/* Ficha seleccionada: el brillo late (sel-pulse-*) para ubicarla rápido. drawTok fija animation-delay según el reloj
   para que el latido no se reinicie cada vez que la ficha se vuelve a dibujar. */
@keyframes sel-pulse-player {
  0%,100% { box-shadow:0 0 0 2px var(--amber-lt),0 0 6px 1px rgba(200,146,42,0.55); }
  50%     { box-shadow:0 0 0 3px #fff3c4,0 0 22px 8px rgba(240,192,96,0.95); }
}
@keyframes sel-pulse-enemy {
  0%,100% { box-shadow:0 0 0 2px rgba(255,85,85,0.8),0 0 6px 1px rgba(255,60,60,0.45); }
  50%     { box-shadow:0 0 0 3px #ffb0b0,0 0 22px 8px rgba(255,60,60,0.95); }
}
.token-player.selected .tbody { animation:sel-pulse-player 1.2s ease-in-out infinite; }
.token-enemy .tbody { border-radius:4px; background:rgba(90,8,8,0.88); border:2px solid rgba(180,40,40,0.75); box-shadow:0 0 10px rgba(180,30,30,0.4); }
.token-enemy.selected .tbody { border-color:#ff5555; animation:sel-pulse-enemy 1.2s ease-in-out infinite; }
/* Terreno: una capa canvas con texturas, debajo de las fichas (ver renderTerrain) */
#terrain-canvas { position:absolute; left:0; top:0; width:var(--view); height:var(--view); z-index:5; pointer-events:none; }
/* Etiqueta con el nombre de la ficha bajo el mouse (solo local, no va a Firebase). Fija en body para que #grid no la recorte.
   #ui-tip = la misma etiqueta para elementos con data-tip (muestras de color): sale al instante, no como el title del navegador */
#ui-tip.below { transform:translate(-50%,0); }
#tok-label, #ui-tip { position:fixed; z-index:500; pointer-events:none; display:none; transform:translate(-50%,-100%); white-space:nowrap; font-family:'Cinzel',serif; font-size:12px; letter-spacing:.5px; color:var(--amber-lt); background:rgba(8,6,4,0.92); border:1px solid var(--amber); border-radius:4px; padding:2px 7px; box-shadow:0 2px 8px rgba(0,0,0,0.6); }
#tok-label.below { transform:translate(-50%,0); }
body.tok-dragging #tok-label { display:none !important; }

/* Left panel */
#left { width:260px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:2px solid var(--amber); display:flex; flex-direction:column; overflow:hidden; height:calc(var(--view) + 4px); }
/* Combatientes y (solo master) Baúl: mitades iguales, cada lista con su propio scroll */
.left-half { flex:1 1 0; min-height:0; display:flex; flex-direction:column; }
/* Divisor arrastrable Combatientes / Baúl de personajes (solo master); la proporción se guarda en localStorage ('leftSplit') */
#left-split { flex:0 0 7px; cursor:row-resize; display:flex; align-items:center; justify-content:center; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:rgba(255,255,255,0.02); }
#left-split::before { content:''; width:36px; height:3px; border-radius:2px; background:rgba(200,146,42,0.45); }
#left-split:hover, #left-split.dragging { background:rgba(200,146,42,0.15); }
#left-split:hover::before, #left-split.dragging::before { background:var(--amber-lt); }
body:not(.is-master) #left-split { display:none; } /* el id le gana a .master-only: ocultarlo explícitamente */
body.split-dragging, body.split-dragging * { cursor:row-resize !important; user-select:none; }
#combat-section { border-bottom:none; }
/* La proporción (--split en #left) solo aplica al master; los jugadores tienen Combatientes a altura completa */
body.is-master #combat-section { flex:var(--split,0.5) 1 0; }
body.is-master #chest-section { flex:calc(1 - var(--split,0.5)) 1 0; }
#left-list, #chest-list { flex:1; min-height:0; overflow-y:auto; }
#left-list::-webkit-scrollbar, #chest-list::-webkit-scrollbar { width:3px; }
#left-list::-webkit-scrollbar-thumb, #chest-list::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.left-half.drop-zone { background:rgba(200,146,42,0.08); outline:1px dashed var(--amber); outline-offset:-4px; }
.chest-item { padding-left:10px; }
.chest-hp { font-family:'Cinzel',serif; font-size:9px; color:rgba(200,160,80,0.7); }
.litem { padding:7px 10px 7px 0; border-bottom:1px solid var(--border); cursor:grab; user-select:none; transition:background .1s; display:flex; align-items:flex-start; gap:0; }
.litem:last-child { border-bottom:none; }
.litem.dragging-item { opacity:.4; }
.litem.drag-over { border-top:2px solid var(--amber-lt); }
.litem.litem-turn { background:rgba(200,146,42,0.07); border-left:2px solid var(--amber); }
.litem-left { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; width:36px; flex-shrink:0; padding-top:2px; border-right:1px solid var(--border); margin-right:8px; }
.litem-num { font-family:'Cinzel',serif; font-size:10px; color:rgba(200,146,42,0.6); line-height:1; padding-left:0; text-align:center; width:100%; }
.litem-cb { width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(200,146,42,0.4); background:rgba(255,255,255,0.04); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; flex-shrink:0; }
.litem-cb:hover { border-color:var(--amber); }
.litem-cb.on { background:var(--amber); border-color:var(--amber-lt); box-shadow:0 0 6px rgba(200,146,42,0.6); }
/* Master sobre personajes de jugadores: la pelotita muestra el turno pero no se puede clickear */
.litem-cb.ro { cursor:default; }
.litem-cb.ro:hover { border-color:rgba(200,146,42,0.4); }
.litem-cb.ro.on:hover { border-color:var(--amber-lt); }
.litem-body { flex:1; min-width:0; }
.litem-header { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.litem-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.litem-dot.enemy { border-radius:2px; }
.litem-name { font-family:'Cinzel',serif; font-size:10px; color:#e0d0b0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.litem-cls { font-family:'Cinzel',serif; font-size:9px; color:rgba(200,160,80,0.7); flex-shrink:0; }
.lhp-row { display:flex; align-items:center; gap:3px; min-height:20px; }
.lhp-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-family:'Cinzel',serif; font-size:10px; width:22px; height:20px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s; }
.lhp-btn:hover { background:rgba(200,146,42,0.2); }
.lhp-val { font-family:'Cinzel',serif; font-size:10px; color:#ddd; flex:1; text-align:center; }
.lhp-bar-wrap { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin-top:4px; }
.lhp-bar { height:100%; border-radius:2px; transition:width .3s,background .3s; }
.lhp-word { font-family:'Cinzel',serif; font-size:10px; letter-spacing:.5px; flex:1; text-align:center; }

/* Right panel */
#side { width:220px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-left:2px solid var(--amber); display:flex; flex-direction:column; overflow-y:auto; max-height:calc(var(--view) + 4px); }
#side::-webkit-scrollbar { width:3px; }
#side::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.section { padding:10px 12px; border-bottom:1px solid var(--border); }
.section:last-child { border-bottom:none; }
#side .section { padding-top:8px; padding-bottom:8px; } /* panel derecho sin scroll: entra justo en --view */
.sec-title { font-family:'Cinzel',serif; font-size:10px; color:var(--amber-lt); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; display:block; }
.sw-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.sw-grid.tok .terr-sw { height:22px; }
/* El panel derecho está medido para la vista del master (la más alta) sin espacio sobrante ni scroll: el selector
   Completa del Mapa mide 130+5+12 = 147px y Prefabricado no lo pasa: pestañas en 2×2 (~48px) + la grilla de muestras,
   que siempre mide 5 columnas × 3 filas de 28px y tiene su propia barra vertical: se pueden sumar terrenos sin límite
   sin mover el resto del panel. Si se agrega algo al panel, achicar #map-sq. */
#map-swatches { grid-template-columns:repeat(5,1fr); grid-auto-rows:28px; height:calc(3*28px + 2*4px + 4px); overflow-y:auto; overflow-x:hidden; padding:2px 4px 2px 2px; box-sizing:border-box; scrollbar-gutter:stable; scrollbar-width:thin; scrollbar-color:var(--amber) rgba(255,255,255,0.07); }
#map-swatches::-webkit-scrollbar { width:5px; }
#map-swatches::-webkit-scrollbar-thumb { background:var(--amber); border-radius:3px; }
#map-swatches::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:3px; }
#map-swatches .terr-sw { height:28px; }
#map-swatches .terr-sw:hover { transform:none; } /* el agrandado se cortaría contra el borde de la grilla con scroll */
#terr-cats { display:grid; grid-template-columns:1fr 1fr; gap:3px; margin-bottom:3px; }
#terr-cats.off { display:none; }
#terr-cats span { text-align:center; font-family:'Cinzel',serif; font-size:9px; letter-spacing:.8px; text-transform:uppercase; padding:4px 0; border:1px solid var(--border); border-radius:3px; color:rgba(255,255,255,0.5); cursor:pointer; white-space:nowrap; }
#terr-cats span:hover { color:rgba(255,255,255,0.75); }
#terr-cats span.active { background:rgba(200,146,42,0.18); color:var(--amber-lt); border-color:var(--amber); }
.pal-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.pal-head .sec-title, .pal-head .plabel { margin-bottom:0; }
.pal-mode { display:flex; margin-left:auto; border:1px solid var(--border); border-radius:3px; overflow:hidden; }
.pal-mode span { font-family:'Cinzel',serif; font-size:7px; letter-spacing:.5px; text-transform:uppercase; padding:3px 5px; color:rgba(255,255,255,0.4); cursor:pointer; }
.pal-mode span:hover { color:rgba(255,255,255,0.7); }
.pal-mode span.active { background:rgba(200,146,42,0.18); color:var(--amber-lt); }
/* Simple y Completa superpuestas en la misma celda: la sección mide siempre lo de la más alta */
.pal-stack { display:grid; }
.pal-stack > * { grid-area:1/1; align-self:start; }
.pal-stack > .pal-off { visibility:hidden; pointer-events:none; }
.pick-sq, .pick-hue { display:block; cursor:crosshair; border-radius:3px; }
.pick-sq { margin-bottom:5px; }
.terr-sw { height:28px; border-radius:3px; cursor:pointer; border:2px solid transparent; transition:border-color .12s,transform .1s; }
.terr-sw:hover { border-color:rgba(255,255,255,0.35); transform:scale(1.06); }
.terr-sw.active { border-color:#fff; box-shadow:0 0 6px rgba(255,255,255,0.25); }
.tbtn-erase { height:28px; border-radius:3px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); font-size:12px; display:flex; align-items:center; justify-content:center; transition:border-color .12s; }
.tbtn-erase:hover { border-color:rgba(255,255,255,0.3); }
.tbtn-erase.active { border-color:rgba(200,80,80,0.9); color:#e08080; background:rgba(180,40,40,0.2); }

/* Pan controls */
/* Dos mitades iguales: botones de terreno a la izquierda, flechas a la derecha, cada uno centrado en la suya */
/* Tres columnas de 90px de alto con 8px parejos entre ellas (44 + 36 + 96 + 2×8 = 192, el ancho de la sección):
   botones de terreno (pincel actual y ✕) | tamaño del pincel (alineado fila por fila con las flechas) | flechas */
#map-tools { display:grid; grid-template-columns:44px 36px 96px; justify-content:space-between; align-items:stretch; margin-top:8px; }
#terr-tools { display:flex; flex-direction:column; gap:6px; }
#terr-tools > .terr-sw, #terr-tools > .tbtn-erase { flex:1; height:auto; }
/* Tamaño del pincel (1×1 / 3×3 / 5×5): columna de tres botones; solo con destino Terreno */
#brush-size { display:flex; flex-direction:column; gap:3px; }
#brush-size.off { visibility:hidden; pointer-events:none; }
#brush-size [data-n] { height:28px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:10px; border:1px solid var(--border); border-radius:4px; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.05); cursor:pointer; }
#brush-size [data-n]:hover { color:rgba(255,255,255,0.85); }
#brush-size [data-n].active { background:rgba(200,146,42,0.18); color:var(--amber-lt); border-color:var(--amber); }
#terr-tools > .tbtn-erase { font-size:15px; }
#terr-tools > .off { visibility:hidden; pointer-events:none; }
#pan-grid { display:grid; grid-template-columns:24px 1fr 24px; gap:3px; width:96px; }
.pan-btn { height:28px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); border-radius:4px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:background .12s; }
.pan-btn:hover { background:rgba(200,146,42,0.2); }
/* Posición de la vista (ox,oy): ámbar claro sobre recuadro oscuro para que se lea */
.pan-center { display:flex; align-items:center; justify-content:center; height:28px; font-family:'Cinzel',serif; font-size:11px; font-weight:700; color:var(--amber-lt); background:rgba(0,0,0,0.6); border:1px solid rgba(200,146,42,0.45); border-radius:4px; white-space:nowrap; letter-spacing:-.3px; text-shadow:0 1px 2px #000; cursor:pointer; user-select:none; transition:background .12s; }
.pan-center:hover { background:rgba(200,146,42,0.25); border-color:var(--amber); }

input[type=text] { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; padding:4px 7px; border-radius:4px; font-family:'EB Garamond',serif; font-size:13px; margin-bottom:6px; outline:none; }
input[type=text]:focus { border-color:var(--amber); }
/* Clase y Tamaño lado a lado */
.cls-size-row { display:flex; gap:4px; }
.cls-size-row > div { min-width:0; }
.cls-size-row > div:first-child { flex:1.3; }
.cls-size-row > div:last-child { flex:1; }
.plabel { font-family:'Cinzel',serif; font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:3px; }
.hpmax-ctrl { display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.hpmax-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:26px; height:28px; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hpmax-btn:hover { background:rgba(200,146,42,0.15); }
.hpmax-val { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; font-family:'Cinzel',serif; font-size:12px; text-align:center; border-radius:4px; height:28px; line-height:28px; }
.btn { font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; padding:6px; border-radius:4px; border:1px solid; cursor:pointer; text-transform:uppercase; width:100%; margin-bottom:4px; transition:background .15s; }
.bp { background:rgba(70,130,210,0.1); border-color:rgba(70,130,210,0.45); color:#80b4ee; }
.bp:hover { background:rgba(70,130,210,0.25); }
.be { background:rgba(170,35,35,0.1); border-color:rgba(170,35,35,0.45); color:#e07070; }
.be:hover { background:rgba(170,35,35,0.25); }
.bd { background:rgba(100,20,20,0.15); border-color:rgba(160,35,35,0.35); color:#c06060; font-size:8px; padding:4px; }
.bd:hover { background:rgba(160,35,35,0.3); }

.tdel { background:none; border:none; color:rgba(200,80,80,0.6); cursor:pointer; font-size:10px; padding:0 2px; }
.tdel:hover { color:#e07070; }
.ctrow { display:flex; gap:4px; margin-bottom:0; }
.ctbtn { flex:1; display:flex; align-items:center; gap:4px; padding:4px 5px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:border-color .12s; }
.ctbtn:hover { border-color:var(--amber-dim); }
.ctbtn.active { border-color:var(--amber); }
.ctbtn span { font-family:'Cinzel',serif; font-size:7px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:.5px; }
.cprev { width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); flex-shrink:0; }

/* Dice panel */
#dice { width:212px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:none; display:flex; flex-direction:column; max-height:calc(var(--view) + 4px); }
#dice::-webkit-scrollbar { width:3px; }
#dice::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.dice-row { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.die-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:22px; height:22px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; flex-shrink:0; }
.die-btn:hover { background:rgba(200,146,42,0.2); }
.die-pick-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:3px; color:rgba(255,255,255,0.6); font-family:'Cinzel',serif; font-size:12px; padding:8px 2px; cursor:pointer; text-align:center; transition:background .12s,border-color .12s; }
.die-pick-btn:hover { background:rgba(255,255,255,0.09); }
.die-pick-btn.has-dice { border-color:var(--amber); background:rgba(200,146,42,0.15); color:var(--amber-lt); }
.roll-btn { font-family:'Cinzel',serif; font-size:12px; letter-spacing:1.5px; padding:9px; border-radius:4px; border:1px solid var(--amber); cursor:pointer; text-transform:uppercase; width:100%; background:rgba(200,146,42,0.1); color:var(--amber-lt); transition:background .15s; margin-top:6px; }
.roll-btn:hover { background:rgba(200,146,42,0.25); }
.roll-locked { opacity:.35; cursor:not-allowed !important; pointer-events:none; }
#dplayer-fixed { width:100%; border:1px solid var(--border); color:var(--amber-lt); padding:5px 7px; border-radius:4px; font-family:'Cinzel',serif; font-size:11px; min-height:26px; box-sizing:border-box; }
#dplayer-fixed.empty { color:rgba(200,180,120,0.45); font-family:'EB Garamond',serif; font-style:italic; }
#dlog-section { background:rgba(28,14,3,0.92); border-top:1px solid var(--border); }
#dlog-section::-webkit-scrollbar { width:3px; }
#dlog-section::-webkit-scrollbar-thumb { background:rgba(200,146,42,0.4); border-radius:2px; }
.dlog-entry { padding:6px 0; border-bottom:1px solid rgba(200,146,42,0.15); }
.dlog-entry:last-child { border-bottom:none; }
.dlog-name { font-family:'Cinzel',serif; font-size:11px; color:var(--amber-lt); }
.dlog-total-val { font-family:'Cinzel',serif; font-size:18px; color:var(--amber-lt); }
.dlog-dice-str { font-family:'Cinzel',serif; font-size:10px; color:var(--amber); }
.dlog-detail-str { font-size:11px; color:rgba(180,110,30,0.75); font-family:'EB Garamond',serif; }
/* Pelotita con el color del personaje que tiró (solo tiradas con color: jugadores/NPCs; no Master ni enemigos) */
.dlog-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:1px; box-shadow:0 0 0 1px rgba(255,255,255,0.35); }
/* Tiradas propias (isOwnRoll) en blanco; las de los demás siguen en ámbar */
.dlog-entry.own .dlog-name, .dlog-entry.own .dlog-total-val, .dlog-entry.own .dlog-dice-str { color:#fff; }
.dlog-entry.own.dlog-detail-str, .dlog-entry.own .dlog-detail-str { color:rgba(255,255,255,0.7); }
.vd-btn { flex:1; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.5px; padding:7px 2px; border-radius:3px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.2); cursor:default; text-transform:uppercase; transition:all .12s; text-align:center; }
#btn-vent:not([disabled]) { border-color:rgba(80,180,80,0.6); background:rgba(30,90,30,0.22); color:#90e090; cursor:pointer; }
#btn-desv:not([disabled]) { border-color:rgba(210,90,70,0.6); background:rgba(110,35,25,0.22); color:#e09078; cursor:pointer; }
.vd-btn:not([disabled]):hover { filter:brightness(1.25); }
#btn-vent.active, #btn-desv.active { border-color:var(--amber-lt); background:rgba(200,146,42,0.18); color:var(--amber-lt); box-shadow:0 0 8px rgba(200,146,42,0.35); }
/* Efecto con Ventaja/Desventaja activa: brillitos que suben (Ventaja) y gotitas rojas que caen (Desventaja). Partículas en initAdvFx */
#btn-vent, #btn-desv { position:relative; }
.vd-fx { position:absolute; inset:0; pointer-events:none; display:none; }
.vd-btn.active .vd-fx { display:block; }
.vd-spark { position:absolute; bottom:3px; font-size:8px; line-height:1; color:#fff3c4; text-shadow:0 0 3px #f0c060,0 0 6px rgba(240,192,96,0.8); opacity:0; animation:vd-rise 1.8s ease-out infinite; }
@keyframes vd-rise { 0%{transform:translateY(0) scale(.3) rotate(0deg);opacity:0} 20%{opacity:1} 100%{transform:translateY(-22px) scale(1) rotate(90deg);opacity:0} }
.vd-drop { position:absolute; top:4px; width:4px; height:4px; border-radius:0 50% 50% 50%; background:radial-gradient(circle at 60% 60%,#ff6a5a 0,#c01414 55%,#6a0606 100%); box-shadow:0 0 3px rgba(200,20,20,0.6); opacity:0; animation:vd-fall 1.6s ease-in infinite; }
@keyframes vd-fall { 0%{transform:translateY(0) rotate(45deg) scale(.4);opacity:0} 15%{opacity:1} 80%{opacity:.9} 100%{transform:translateY(22px) rotate(45deg) scale(1);opacity:0} }
@media (prefers-reduced-motion:reduce) { .vd-fx { display:none !important; } }
#dice .sec-title { font-size:12px; }
#dice .plabel { font-size:11px; letter-spacing:.5px; }
#dbounce { width:100%; accent-color:var(--amber); margin:0 0 6px; cursor:pointer; }
#scene-select, #cls-select, #size-select { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); padding:5px 7px; border-radius:4px; font-family:'Cinzel',serif; font-size:11px; margin-bottom:6px; outline:none; cursor:pointer; appearance:none; }
#scene-select:focus, #cls-select:focus, #size-select:focus { border-color:var(--amber); }
#scene-select option, #cls-select option, #size-select option { background:#140e04; color:#ddd; }

/* Login overlay */
#login-overlay { position:fixed; inset:0; background:rgba(8,6,4,0.98); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
#login-overlay.hidden { display:none; }
#login-title { font-family:'Cinzel',serif; font-size:30px; color:var(--amber-lt); letter-spacing:5px; text-transform:uppercase; }
#login-sub { font-family:'EB Garamond',serif; font-size:16px; color:rgba(200,160,80,0.55); letter-spacing:1px; }
#btn-google { display:flex; align-items:center; gap:10px; padding:11px 28px; background:rgba(255,255,255,0.06); border:1px solid var(--amber); border-radius:5px; cursor:pointer; font-family:'Cinzel',serif; font-size:12px; letter-spacing:1.5px; color:var(--amber-lt); text-transform:uppercase; transition:background .15s; margin-top:8px; }
#btn-google:hover { background:rgba(200,146,42,0.2); }
#login-error { font-family:'EB Garamond',serif; font-size:14px; color:#e07070; display:none; text-align:center; max-width:320px; }

/* Account */
#account-email { display:block; font-family:'EB Garamond',serif; font-size:12px; color:rgba(200,160,80,0.75); letter-spacing:.3px; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
#logout-section.hidden, #dplayer-fixed.hidden { display:none; }
body:not(.is-master) .master-only { display:none; }

</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-title">Combat Mat</div>
  <div id="login-sub">D&amp;D Session Tools</div>
  <button id="btn-google" onclick="signInWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>

      <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Entrar con Google
  </button>
  <div id="login-error"></div>
</div>

<div id="app">

  <!-- Dice panel -->
  <div id="dice">
    <div class="section">
      <span class="sec-title">Nombre</span>
      <div id="dplayer-fixed"></div>
    </div>
    <div class="section">
      <span class="sec-title">Dados</span>
      <div id="dice-rows"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px">
        <button class="die-pick-btn roll-gate" onclick="rollPercent()"><span style="font-size:10.5px">Porcentaje</span></button>
        <button class="die-pick-btn roll-gate" onclick="rollCoin()"><span style="font-size:10.5px">Todo o Nada</span></button>
      </div>
      <div style="display:flex;align-items:center;gap:4px;margin:5px 0 6px">
        <span id="dsel-str" style="font-family:'Cinzel',serif;font-size:11px;color:rgba(200,180,120,0.7);flex:1">—</span>
        <button onclick="clearDice()" style="background:rgba(140,30,30,0.25);border:1px solid rgba(220,80,80,0.6);color:#e08080;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.5px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:background .12s" onmouseover="this.style.background='rgba(180,40,40,0.45)'" onmouseout="this.style.background='rgba(140,30,30,0.25)'">Limpiar</button>
      </div>
      <label class="plabel">Modificador</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:6px">
        <button class="die-btn" onclick="adjMod(-5)" style="font-size:9px;border-radius:3px 0 0 3px">-5</button>
        <button class="die-btn" onclick="adjMod(-1)" style="border-radius:0;border-left:none">−</button>
        <span id="dmod-val" style="font-family:'Cinzel',serif;font-size:13px;color:#ddd;width:28px;height:26px;line-height:26px;text-align:center;border:1px solid var(--border);border-left:none;background:rgba(255,255,255,0.04)">0</span>
        <button class="die-btn" onclick="adjMod(1)" style="border-radius:0;border-left:none">+</button>
        <button class="die-btn" onclick="adjMod(5)" style="font-size:9px;border-radius:0 3px 3px 0;border-left:none">+5</button>
      </div>
      <div style="display:flex;gap:3px;margin-bottom:6px">
        <button id="btn-vent" class="vd-btn" onclick="setAdvMode('vent')" disabled>Ventaja</button>
        <button id="btn-desv" class="vd-btn" onclick="setAdvMode('desv')" disabled>Desventaja</button>
      </div>
      <label class="plabel" for="dbounce">Rebote <span id="dbounce-val" style="color:var(--amber-lt)"></span></label>
      <input type="range" id="dbounce" min="0" max="100" step="1" value="33" oninput="setDuration(dSliderToSecs(+this.value))">
      <button class="roll-btn roll-gate" onclick="rollDice()">⚄ Tirar</button>
    </div>
    <div class="section" style="text-align:center;padding:10px 12px;height:58px;flex-shrink:0">
      <div id="droll-result" style="font-family:'Cinzel',serif;font-size:30px;color:var(--amber-lt);height:38px;line-height:38px;letter-spacing:2px;overflow:hidden"></div>
    </div>
    <div id="dlog-section" class="section" style="flex:1;overflow-y:auto;min-height:80px">
      <span class="sec-title">Historial</span>
      <div id="dlog-list"></div>
    </div>
  </div>

  <!-- Left panel -->
  <div id="left">
    <div class="section left-half" id="combat-section">
      <span class="sec-title">Combatientes</span>
      <div id="left-list"></div>
    </div>
    <div id="left-split" class="master-only" title="Arrastrar para cambiar el tamaño"></div>
    <div class="section left-half master-only" id="chest-section" style="border-bottom:none">
      <span class="sec-title">Baúl de personajes</span>
      <div id="chest-list"></div>
    </div>
  </div>

  <!-- Grid -->
  <div id="grid-wrap" style="position:relative;flex-shrink:0;">
    <div id="grid"></div>
    <div id="world-map"></div>
    <canvas id="dice-canvas" width="880" height="880" style="position:absolute;top:2px;left:2px;pointer-events:none;z-index:40;"></canvas>
    <svg id="arrow-svg" style="position:absolute;top:2px;left:2px;pointer-events:none;z-index:50;" width="880" height="880"><defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="arrows-remote"></g><g id="arrow-local"></g></svg>
  </div>

  <!-- Right panel -->
  <div id="side">

    <div class="section">
      <span class="sec-title">Escena</span>
      <div class="scene-row">
      <select id="scene-select" onchange="onSceneSelect(this.value)" style="margin-bottom:0">
        <option value="escena1">Escena 1</option>
        <option value="escena2">Escena 2</option>
        <option value="escena3">Escena 3</option>
        <option value="escena4">Escena 4</option>
        <option value="escena5">Escena 5</option>
        <option value="escena6">Escena 6</option>
        <option value="escena7">Escena 7</option>
        <option value="escena8">Escena 8</option>
        <option value="escena9">Escena 9</option>
        <option value="escena10">Escena 10</option>
      </select>
      <button id="map-toggle" onclick="toggleWorldMap()" title="Mostrar/ocultar el mapa del mundo">Mapa</button>
      </div>
    </div>

    <div class="section">
      <div class="pal-head">
        <span class="sec-title">Mapa</span>
        <div class="pal-mode" id="mode-map">
          <span data-m="simple" onclick="setPalMode('map','simple')">Prefabricado</span><span data-m="full" onclick="setPalMode('map','full')">Completa</span>
        </div>
      </div>
      <div class="ctrow" id="map-targets" style="margin-bottom:6px">
        <div class="ctbtn" id="ctbtn-terrain" onclick="setMapTarget('terrain')"><div class="cprev" id="cprev-terrain"></div><span>Terreno</span></div>
        <div class="ctbtn" id="ctbtn-bg"      onclick="setMapTarget('bg')">     <div class="cprev" id="cprev-bg"></div>     <span>Fondo</span></div>
        <div class="ctbtn" id="ctbtn-line"    onclick="setMapTarget('line')">   <div class="cprev" id="cprev-line"></div>   <span>Líneas</span></div>
      </div>
      <!-- Prefabricado (modo 'simple'): en Terreno, pestañas por sección (TERR_CATS) y sus terrenos;
           en Fondo/Líneas, sus colores aplicados a la grilla -->
      <div class="pal-stack">
      <div id="map-simple"><div id="terr-cats"></div><div id="map-swatches" class="sw-grid"></div></div>
      <!-- Completa: selector HSV (en Terreno, pinta con cualquier color) -->
      <div id="map-full">
        <canvas id="map-sq"  class="pick-sq"  width="192" height="128"></canvas>
        <canvas id="map-hue" class="pick-hue" width="192" height="12"></canvas>
      </div>
      </div>
      <div id="map-tools">
      <!-- Borrar terreno y pincel de color libre (Completa), a la izquierda de las flechas -->
      <div id="terr-tools">
        <div class="terr-sw" id="brush-custom" onclick="selectTerrain(curBrush())"></div>
        <div class="tbtn-erase" data-terr="eraser" onclick="selectTerrain('eraser')" data-tip="Borrar terreno">✕</div>
      </div>
      <!-- Tamaño del pincel de terreno (cuadrado centrado en la celda clickeada), entre los botones de terreno y las flechas -->
      <div id="brush-size">
        <span data-n="1" class="active" onclick="setBrushSize(1)" data-tip="Pincel 1×1">1×1</span>
        <span data-n="3" onclick="setBrushSize(3)" data-tip="Pincel 3×3">3×3</span>
        <span data-n="5" onclick="setBrushSize(5)" data-tip="Pincel 5×5">5×5</span>
      </div>
      <div id="pan-grid">
        <div></div>
        <div class="pan-btn" onclick="pan(0,-1)">▲</div>
        <div></div>
        <div class="pan-btn" onclick="pan(-1,0)">◀</div>
        <div class="pan-center" id="coord-lbl" onclick="resetView()" title="Volver a 0,0 con zoom normal">0,0</div>
        <div class="pan-btn" onclick="pan(1,0)">▶</div>
        <div></div>
        <div class="pan-btn" onclick="pan(0,1)">▼</div>
        <div></div>
      </div>
      </div>
      <button class="btn bd" onclick="clearTerrain()" style="margin:8px 0 0">Limpiar terreno</button>
    </div>

    <div class="section">
      <span class="sec-title">Gestión de Tokens</span>
      <label class="plabel">Nombre</label>
      <input type="text" id="iname" placeholder="Nombre..." maxlength="18" oninput="updateCharBtn()">
      <div class="cls-size-row">
        <div><label class="plabel">Clase</label><select id="cls-select" onchange="selectedClass=this.value;updateCharBtn()"></select></div>
        <div><label class="plabel">Tamaño</label><select id="size-select" onchange="selectedSize=this.value;updateCharBtn()"></select></div>
      </div>
      <label class="plabel">HP Máx</label>
      <div class="hpmax-ctrl">
        <button class="hpmax-btn" onclick="adjMaxHp(-5)" style="font-size:10px">-5</button>
        <button class="hpmax-btn" onclick="adjMaxHp(-1)">−</button>
        <div class="hpmax-val" id="ihp-val">10</div>
        <button class="hpmax-btn" onclick="adjMaxHp(1)">+</button>
        <button class="hpmax-btn" onclick="adjMaxHp(5)" style="font-size:10px">+5</button>
      </div>
      <div class="pal-head" style="margin-bottom:4px">
        <label class="plabel">Color</label>
        <div class="cprev" id="cprev-player"></div>
        <div class="pal-mode" id="mode-tok">
          <span data-m="simple" onclick="setPalMode('tok','simple')">Simple</span><span data-m="full" onclick="setPalMode('tok','full')">Completa</span>
        </div>
      </div>
      <div class="pal-stack" style="margin-bottom:8px">
        <div id="tok-simple" class="sw-grid tok"></div>
        <div id="tok-full">
          <canvas id="tok-sq"  class="pick-sq"  width="192" height="80"></canvas>
          <canvas id="tok-hue" class="pick-hue" width="192" height="12"></canvas>
        </div>
      </div>
      <button class="btn bp" id="btn-add-player" onclick="charBtnClick()">Nuevo personaje</button>
      <button class="btn be master-only" onclick="addTok('enemy')">+ Enemigo</button>
    </div>

    <div class="section" style="margin-top:auto">
      <div class="hidden" id="logout-section" style="margin-bottom:8px">
        <span id="account-email"></span>
        <button class="btn bp" id="btn-logout" onclick="signOutUser()" style="margin-bottom:0">Cerrar sesión</button>

      <button class="btn bp" id="btn-fs" onclick="toggleFullscreen()" style="margin-bottom:0">Pantalla completa</button>
    </div>

  </div>
</div>

<script>
// ── Firebase ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyDEYQFhozdmZklBT1K_BHelZZxDjJLFSyU",
  authDomain:        "combat-mat.firebaseapp.com",
  projectId:         "combat-mat",
  storageBucket:     "combat-mat.firebasestorage.app",
  messagingSenderId: "299947800344",
  appId:             "1:299947800344:web:bb7a2d221a9987d8d1d06d",
  databaseURL:       "https://combat-mat-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
const CLIENT_ID = Math.random().toString(36).slice(2);

// Modo prueba: ?prueba (como jugador) o ?prueba=master (como master) usa datos aparte en
// sala/prueba, sin tocar la partida real ni log.html/dice.html (que leen sala/rolls)
const TEST_MODE = new URLSearchParams(location.search).get('prueba'); // null = partida real
const ROOT = TEST_MODE === null ? 'sala' : 'sala/prueba';
if (TEST_MODE !== null) {
  const tag = document.createElement('div');
  tag.textContent = 'MODO PRUEBA · ' + (TEST_MODE === 'master' ? 'MASTER' : 'JUGADOR');
  tag.style.cssText = "position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;background:#7a1414;color:#fff;font:600 11px 'Cinzel',serif;letter-spacing:2px;padding:3px 12px;border-radius:0 0 4px 4px;pointer-events:none";
  document.body.appendChild(tag);
  document.title = '[PRUEBA] ' + document.title;
}

// ── Auth ──────────────────────────────────────────────────
const ALLOWED_EMAILS = [
  'godoydemian@gmail.com',
  'pointandclickstr@gmail.com',
  'wansaia@gmail.com',
  'luciaderecho@gmail.com',
  'juanalbarracin92@gmail.com',
];

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(result => {
    if (result && result.user) handleAuthUser(result.user);
  }).catch(err => {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    const el = document.getElementById('login-error');
    el.textContent = err.code === 'auth/popup-blocked'
      ? 'Tu navegador bloqueó la ventana de Google. Permití ventanas emergentes para este sitio e intentá de nuevo.'
      : `Error al iniciar sesión (${err.code}).`;
    el.style.display = 'block';
  });
}

// La cuenta del master puede crear personajes sin límite; el resto, uno a la vez (owner = su uid)
const MASTER_EMAIL = 'juanalbarracin92@gmail.com';
let me = null;
const isMaster = () => !!me && (TEST_MODE === null ? me.email === MASTER_EMAIL : TEST_MODE === 'master');

// Al cerrar sesión Firebase cancela los listeners (las reglas piden auth) y initFirebase no se vuelve a correr:
// recargar deja todo limpio para la próxima cuenta (incluido el listener del baúl si entra el master)
function signOutUser() {
  auth.signOut().finally(() => location.reload());
}

let appReady = false;

function handleAuthUser(user) {
  const overlay = document.getElementById('login-overlay');
  const errorEl = document.getElementById('login-error');
  const accountEmail = document.getElementById('account-email');
  const logoutSection = document.getElementById('logout-section');
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    me = user;
    overlay.classList.add('hidden');
    accountEmail.textContent = user.email;
    logoutSection.classList.remove('hidden');
    if (!appReady) { appReady = true; initFirebase(); fitApp(); }
    refreshPlayerControls();
  } else if (user) {
    errorEl.textContent = `Acceso denegado: ${user.email} no está autorizado.`;
    errorEl.style.display = 'block';
    logoutSection.classList.add('hidden');
    auth.signOut();
  } else {
    overlay.classList.remove('hidden');
    logoutSection.classList.add('hidden');
  }
}

/* ── Color utils ── */
function hsvToRgb(h,s,v){const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60),p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function hsvToHex(h,s,v){return rgbToHex(...hsvToRgb(h,s,v));}
function hexToHsv(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  let h=0;
  if(d){h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}
  return{h,s:mx?d/mx:0,v:mx};
}
const hsvHex=p=>hsvToHex(p.h,p.s,p.v);
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ── Selector HSV (cuadrado saturación/brillo + barra de tono) ── */
// Una instancia por paleta. onPick(hsv) se llama cuando el usuario lo mueve; set(hsv) lo posiciona sin avisar.
function makeHsvPicker(sqId,hueId,onPick){
  const sq=document.getElementById(sqId),hc=document.getElementById(hueId);
  const p={h:0,s:0,v:0};
  function draw(){
    const W=sq.width,H=sq.height,ctx=sq.getContext('2d');
    const[r,g,b]=hsvToRgb(p.h,1,1);
    ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(0,0,W,H);
    const wg=ctx.createLinearGradient(0,0,W,0);wg.addColorStop(0,'rgba(255,255,255,1)');wg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const cx=p.s*W,cy=(1-p.v)*H;
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.stroke();
    const hctx=hc.getContext('2d'),hg=hctx.createLinearGradient(0,0,hc.width,0);
    for(let i=0;i<=360;i+=30)hg.addColorStop(i/360,`hsl(${i},100%,50%)`);
    hctx.fillStyle=hg;hctx.fillRect(0,0,hc.width,hc.height);
    hctx.beginPath();hctx.arc(p.h/360*hc.width,hc.height/2,5,0,Math.PI*2);hctx.strokeStyle='#fff';hctx.lineWidth=2;hctx.stroke();
  }
  // getBoundingClientRect ya incluye el zoom de #app; se normaliza a 0..1
  function onSq(e){const r=sq.getBoundingClientRect();p.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));p.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));draw();onPick({...p});}
  function onH(e){const r=hc.getBoundingClientRect();p.h=Math.max(0,Math.min(359,(e.clientX-r.left)/r.width*360));draw();onPick({...p});}
  let sqD=false,hD=false;
  sq.addEventListener('mousedown',e=>{sqD=true;onSq(e);e.stopPropagation();});
  hc.addEventListener('mousedown',e=>{hD=true;onH(e);e.stopPropagation();});
  document.addEventListener('mousemove',e=>{if(sqD)onSq(e);if(hD)onH(e);});
  document.addEventListener('mouseup',()=>{sqD=false;hD=false;});
  return{set(hsv){p.h=hsv.h;p.s=hsv.s;p.v=hsv.v;draw();}};
}

/* ── Pan ── */
function pan(dx,dy){

// Centro de las flechas: vuelve a la vista inicial (zoom nivel 2, esquina en 0,0)
function resetView(){setZoomLevel(2);pan(-S.ox,-S.oy);}

/* ── Zoom (3 niveles, sin animación) ── */
// (px,py) = punto del mat en px sin el zoom de #app; la celda bajo ese punto queda (casi) fija al cambiar de nivel
function setZoomLevel(lv,px=VIEW/2,py=VIEW/2){
  if(!ZOOM_CELLS[lv]||lv===zoomLevel)return;
  const oldCS=CS;
  zoomLevel=lv; COLS=ROWS=ZOOM_CELLS[lv]; CS=VIEW/COLS;
  document.documentElement.style.setProperty('--cs',CS+'px');
  S.ox=Math.round(S.ox+px/oldCS-px/CS);
  S.oy=Math.round(S.oy+py/oldCS-py/CS);
  document.getElementById('coord-lbl').textContent=`${S.ox},${S.oy}`;
  clearArrow(); applyGridColors();
  renderTerrain(); renderAllToks();
}
// Rueda arriba = acercar (nivel 1), abajo = alejar (nivel 3). Un gesto continuo (trackpad) cuenta como un solo paso.
let zoomLockUntil=0;
grid.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=performance.now();
  if(now<zoomLockUntil){zoomLockUntil=now+150;return;}
  if(!e.deltaY)return;
  zoomLockUntil=now+150;
  const r=grid.getBoundingClientRect();
  setZoomLevel(zoomLevel+(e.deltaY<0?-1:1),(e.clientX-r.left)/appZoom,(e.clientY-r.top)/appZoom-2);
},{passive:false});

function updateTerrainUI(){

// Convierte coordenadas de mouse a celda absoluta (col+ox, row+oy) y pinta/borra terreno
function paintCell(e){
  const rect=grid.getBoundingClientRect();
  const z=CS*appZoom;
  const sc=Math.floor((e.clientX-rect.left)/z);
  const sr=Math.floor((e.clientY-rect.top-2*appZoom)/z);
  if(sc<0||sc>=COLS||sr<0||sr>=ROWS)return;
  // Pincel de brushSize×brushSize celdas con centro en la celda clickeada (también el borrador)
  const h=(brushSize-1)/2,upd={};
  for(let dr=-h;dr<=h;dr++)for(let dc=-h;dc<=h;dc++){
    const key=`${sc+S.ox+dc},${sr+S.oy+dr}`;
    const a=S.activeTerrain,cur=parseTerr(S.terrain[key]);let next;
    if(a==='eraser'){
      // Borra una capa por pasada: primero el fuego/sangre de encima, y en otra pasada (otro clic) el piso
      if(terrStroke.has(key))continue;
      next=cur.over?joinTerr(cur.base,null):null;
    }else if(TERR_OVER[a]){ // encima de un terreno simple; sobre un color libre lo reemplaza
      let ov=a;
      if(TERR_VARIANTS[a]){

  trap(c,s){ // pinchos de metal (pirámides vistas desde arriba) con tinte rojizo; va encima, o sobre trapBg si está sola

    c.strokeStyle='#5a4a3a';c.lineWidth=Math.max(1,s*0.07);c.beginPath();c.moveTo(s*0.4,s*0.36);c.lineTo(s*0.2,s*0.5);c.moveTo(s*0.6,s*0.36);c.lineTo(s*0.8,s*0.3);c.stroke(); // brazos
    c.fillStyle='#6a4a3a';c.beginPath();c.ellipse(s*0.5,s*0.48,s*0.13,s*0.18,0,0,6.2832);c.fill();   // torso
    c.fillStyle='#c8a888';disc(c,s*0.5,s*0.24,s*0.08);c.fillStyle='#5a3a1a';disc(c,s*0.5,s*0.21,s*0.06); // cabeza y pelo
  },
  bones(c,s,R){ // huesos sueltos y una calavera (girados al azar)
    c.lineCap='round';
    const bone=(x1,y1,x2,y2)=>{c.strokeStyle='#d8ceb4';c.lineWidth=Math.max(1,s*0.035);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.fillStyle='#e4dac0';for(const[x,y]of[[x1,y1],[x2,y2]]){disc(c,x-s*0.015,y,s*0.025);disc(c,x+s*0.015,y,s*0.025);}};
    for(let i=0;i<3;i++){const x=s*(0.2+R()*0.6),y=s*(0.2+R()*0.6),a=R()*3.14,l=s*(0.15+R()*0.12);bone(x-Math.cos(a)*l/2,y-Math.sin(a)*l/2,x+Math.cos(a)*l/2,y+Math.sin(a)*l/2);}
    const x=s*0.55,y=s*0.45;c.fillStyle='#e8dec4';disc(c,x,y,s*0.1);c.fillRect(x-s*0.06,y+s*0.05,s*0.12,s*0.06);
    c.fillStyle='#2a2018';disc(c,x-s*0.04,y,s*0.025);disc(c,x+s*0.04,y,s*0.025);c.fillRect(x-s*0.01,y+s*0.04,s*0.02,s*0.025);
  },
  tomb(c,s){ // lápida con montículo de tierra
    const sh=Math.max(1,s*0.04);
    c.fillStyle='#5a4028';c.beginPath();c.ellipse(s*0.5,s*0.68,s*0.28,s*0.24,0,0,6.2832);c.fill();
    c.fillStyle='rgba(255,220,170,0.12)';c.beginPath();c.ellipse(s*0.45,s*0.62,s*0.16,s*0.1,0,0,6.2832);c.fill();
    const stone=(dx,dy,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(s*0.3+dx,s*0.46+dy);c.lineTo(s*0.3+dx,s*0.22+dy);c.arc(s*0.5+dx,s*0.22+dy,s*0.2,Math.PI,0);c.lineTo(s*0.7+dx,s*0.46+dy);c.closePath();c.fill();};
    stone(sh,sh,'rgba(0,0,0,0.45)');stone(0,0,'#8a8a90');
    c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(s*0.3,s*0.42,s*0.4,Math.max(1,s*0.03));
    c.fillStyle='#4a4a52';c.fillRect(s*0.48,s*0.12,s*0.04,s*0.24);c.fillRect(s*0.41,s*0.18,s*0.18,s*0.04); // cruz grabada
  },
  signpost(c,s){ // poste indicador (girado al azar): dos tablas con punta de flecha y el poste en el medio
    const board=(a,len)=>{c.save();c.translate(s/2,s/2);c.rotate(a);
      c.fillStyle='rgba(0,0,0,0.35)';c.fillRect(s*0.02,s*0.0,len,s*0.1);
      c.fillStyle='#9a6a3a';c.beginPath();c.moveTo(0,-s*0.05);c.lineTo(len-s*0.06,-s*0.05);c.lineTo(len,0);c.lineTo(len-s*0.06,s*0.05);c.lineTo(0,s*0.05);c.closePath();c.fill();
      c.fillStyle='rgba(40,20,6,0.5)';c.fillRect(s*0.06,-Math.max(0.5,s*0.006),len-s*0.16,Math.max(1,s*0.012));c.restore();};
    board(0,s*0.42);board(2.4,s*0.38);
    c.fillStyle='#5a3a1a';disc(c,s/2,s/2,s*0.07);c.fillStyle='rgba(255,220,170,0.2)';disc(c,s*0.48,s*0.48,s*0.03);
  },
  bush(c,s,R){ // arbustos (encima): matas redondas con hojas y a veces bayas; terreno difícil
    const n=4,cl=[];
    for(let i=0;i<n;i++)cl.push([s*(0.28+R()*0.44),s*(0.28+R()*0.44),s*(0.2+R()*0.1),R(),R(),R()]);
    c.fillStyle='rgba(0,0,0,0.4)';for(const[x,y,r]of cl)disc(c,x+r*0.25,y+r*0.3,r);
    c.fillStyle='#16300c';for(const[x,y,r]of cl)disc(c,x,y,r+Math.max(1,s*0.02)); // contorno oscuro: se distingue de la hierba
    for(const[x,y,r,a,b,d]of cl){
      c.fillStyle=rgb(70+a*30,130+b*40,40+d*20);disc(c,x,y,r);
      const L=cellRng(Math.round(x*7),Math.round(y*7),31);
      for(let k=0;k<5;k++){const ang=L()*6.2832,dd=L()*r*0.7;c.fillStyle=L()<0.5?'rgba(120,190,80,0.35)':'rgba(10,40,8,0.3)';disc(c,x+Math.cos(ang)*dd,y+Math.sin(ang)*dd,r*0.3);}
      if(d>0.6){c.fillStyle='#b8202a';for(let k=0;k<3;k++)disc(c,x+(L()-0.5)*r,y+(L()-0.5)*r,Math.max(0.8,s*0.022));}
    }
  },
  vines(c,s,R,t,nb){ // enredaderas (encima): tallos que llegan a las enredaderas vecinas por el mismo punto del borde
    const col=nb?nb.col:0,row=nb?nb.row:0,L=nb?nb.links:0;
    const h=(a,b,salt)=>cellRng(a,b,salt)();
    // punto de cada borde, en px de la celda (sale de la coordenada del borde: la vecina usa el mismo)
    const A={1:[s*(0.2+0.6*h(col,row,51)),0],4:[s*(0.2+0.6*h(col,row+1,51)),s],8:[0,s*(0.2+0.6*h(col,row,52))],2:[s,s*(0.2+0.6*h(col+1,row,52))]};
    const hub=[s*(0.35+R()*0.3),s*(0.35+R()*0.3)],ends=L?[1,2,4,8].filter(b=>L&b):[8,2,1,4];
    c.lineCap='round';
    for(const b of ends){
      const[ax,ay]=A[b],mx=(ax+hub[0])/2+(R()-0.5)*s*0.25,my=(ay+hub[1])/2+(R()-0.5)*s*0.25;
      c.strokeStyle='rgba(0,0,0,0.45)';c.lineWidth=Math.max(1.5,s*0.07);c.beginPath();c.moveTo(ax+1,ay+1);c.quadraticCurveTo(mx+1,my+1,hub[0]+1,hub[1]+1);c.stroke();
      c.strokeStyle='#5c3a1a';c.lineWidth=Math.max(1,s*0.05);c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(mx,my,hub[0],hub[1]);c.stroke(); // tallo leñoso
      for(let k=1;k<=4;k++){ // hojas alternadas a lo largo del tallo, con borde oscuro
        const tt=k/5,x=(1-tt)*(1-tt)*ax+2*(1-tt)*tt*mx+tt*tt*hub[0],y=(1-tt)*(1-tt)*ay+2*(1-tt)*tt*my+tt*tt*hub[1],side=k%2?1:-1,ang=R()*6.28;
        c.fillStyle=R()<0.5?'#8ad04a':'#6cb83a';c.strokeStyle='#1c3a0e';c.lineWidth=Math.max(0.7,s*0.015);
        c.beginPath();c.ellipse(x+side*s*0.05,y,s*0.085,s*0.045,ang,0,6.2832);c.fill();c.stroke();
      }
    }
    if(ends.length===1){c.strokeStyle='#3a6a1e';c.lineWidth=Math.max(1,s*0.035);c.beginPath();c.arc(hub[0],hub[1],s*0.06,0,4.5);c.stroke();} // punta enrulada
  },
  crack(c,s,R){ // grieta suelta (muestra de la paleta); en el mat se dibujan unidas con drawCracks
    crackPoly(c,[[s*0.15,s*0.25],[s*0.85,s*0.75]],s,R,0.11,true);
  },
  cloud(c,s,R,t){ // nube mágica: bruma lila semitransparente con destellos, va encima; animada: se desplaza y titila
    c.fillStyle='rgba(175,165,215,0.28)';c.fillRect(0,0,s,s); // velo parejo: sin cortes entre celdas vecinas
    for(let i=0;i<4;i++){
      const x0=R()*s,y0=R()*s,r=s*(0.3+R()*0.25),ph=R()*6.28;
      const x=x0+(t==null?0:Math.sin(t*0.4+ph)*s*0.1),y=y0+(t==null?0:Math.cos(t*0.3+ph)*s*0.06),a=t==null?0.35:0.25+0.15*(0.5+0.5*Math.sin(t*0.8+ph));
      const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(225,215,255,${a})`);g.addColorStop(1,'rgba(225,215,255,0)');c.fillStyle=g;c.fillRect(0,0,s,s);
    }
    const n=2+Math.round(R()*2),d=Math.max(1,s*0.03);
    for(let i=0;i<n;i++){const x=R()*s,y=R()*s,ph=R()*6.28,a=t==null?0.7:0.15+0.8*Math.max(0,Math.sin(t*2+ph));c.fillStyle=`rgba(255,250,255,${a})`;c.fillRect(x,y,d,d);}
  },
};
// Fondo propio de algunas capas de encima cuando están solas (sin piso debajo). Las demás (sangre, escombros…) no tienen:
// se ve la grilla. Con fondo propio llevan además la línea de grilla tenue, como un piso.
function fireBg(c,s){const g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,'#6a1a06');g.addColorStop(1,'#a83008');c.fillStyle=g;c.fillRect(0,0,s,s);}
function trapBg(c,s){c.fillStyle='#3a0404';c.fillRect(0,0,s,s);}
function fenceBg(c,s){c.fillStyle='rgba(120,95,45,0.30)';c.fillRect(0,0,s,s);}
const OVER_BG={fire:fireBg,trap:trapBg,fence:fenceBg};
// Terrenos que se animan cuando forman un grupo (vecinos de lado) de al menos tantas celdas como su valor: el fuego
// siempre (aunque sea una celda), el resto desde 4. Cada capa agrupa por separado: el fuego encima de piedra se anima
// con el resto del fuego, no con la piedra.
const TERR_ANIM={lava:4,water:4,fire:1,acid:4,cloud:4,shallow:4,dirty:4,torch:1};
// Muestra de la paleta Simple: la textura de verdad, dibujada una vez y cacheada como imagen
const terrSwCache={};
function terrBg(type){
  if(!terrSwCache[type]){
    const cv=document.createElement('canvas');cv.width=cv.height=88;const c=cv.getContext('2d');c.scale(2,2);
    if(OVER_BG[type])OVER_BG[type](c,44);
    else if(TERR_OVER[type]){c.fillStyle='#1c1612';c.fillRect(0,0,44,44);} // sin fondo propio: sobre un piso oscuro
    if(type==='void'){ // negro sobre el panel oscuro no se ve: en la muestra va como un pozo con borde de tierra
      c.fillStyle='#6b4a2c';c.fillRect(0,0,44,44);
      c.beginPath();c.roundRect?c.roundRect(7,7,30,30,8):c.rect(7,7,30,30);c.clip();
    }
    if(TERRAIN_TEX[type])TERRAIN_TEX[type](c,44,cellRng(2,3,terrSalt(type)),null);
    else if(LIQ[type]){ // fluido sin textura por celda: sus colores de adentro y su detalle
      const L=LIQ[type];for(const b of L.bands.slice(1))if(b[0]==='F'){c.fillStyle=b[2];c.fillRect(0,0,44,44);}
      L.detail(c,44,cellRng(2,3,terrSalt(type)),null);
    }
    terrSwCache[type]=cv.toDataURL();
  }
  return `${TERRAIN[type].sw} url(${terrSwCache[type]}) center/cover`;
}

/* ── Líquidos: se dibujan por grupos, con forma ──
   Agua, lava, barro y hielo (pisos) y sangre y ácido (encima) no se dibujan celda por celda: cada grupo de celdas iguales
   es una sola mancha. La forma sale de un campo suave F = ocupación del grupo suavizada (en cada eje una rampa de ancho w
   alrededor del borde de la celda: suma 1 adentro, 0 afuera y 0.5 justo en un borde recto) más un poco de ruido; el
   contorno es F = umbral, trazado con marching squares (liqPath). w chico = esquinas apenas redondeadas; w grande = más
   redondas. Los rincones en L se rellenan solos (la mancha entra un poco en la celda diagonal). D es el mismo campo con
   una rampa ancha: llega a ~1 solo lejos de la orilla (agua profunda, centro de la lava). Las bandas (orilla, cuerpo,
   fondo) son contornos a distintos umbrales de F o D, pintados uno sobre otro. Todo sale de coordenadas absolutas: todos
   ven la misma forma y no cambia con pan ni zoom. Es solo visual: la celda sigue contando entera.
   Los pisos líquidos se apilan en LIQ_BASE_ORDER: cada uno se extiende por debajo de los que van más arriba (el barro
   sigue debajo del agua, el agua debajo del hielo), así una esquina redondeada deja ver al otro líquido y no un hueco.
   Contra un terreno que no es líquido, la esquina recortada muestra ese terreno (under), y si no hay nada, el fondo. */
function waterDetail(c,s,R,t){ // olas; animadas: se mecen y brillan
  const n=s>=80?4:3;c.lineCap='round';c.lineWidth=Math.max(1,s*0.03);
  for(let i=0;i<n;i++){
    const x=R()*s,y=(i+0.3+R()*0.5)/n*s,w=s*(0.18+R()*0.12),ph=R()*6.28;
    const dx=t==null?0:Math.sin(t*1.1+ph)*s*0.06,a=t==null?0.35:0.2+0.25*(0.5+0.5*Math.sin(t*1.7+ph));
    c.strokeStyle=`rgba(190,220,255,${a})`;
    c.beginPath();c.moveTo(x+dx-w/2,y);c.quadraticCurveTo(x+dx-w/4,y-w*0.25,x+dx,y);c.quadraticCurveTo(x+dx+w/4,y+w*0.25,x+dx+w/2,y);c.stroke();
  }
}
function lavaDetail(c,s,R,t){ // vetas brillantes, costras y burbujas (animadas: el brillo late y las burbujas revientan)
  for(let i=0;i<3;i++){
    const x=R()*s,y=R()*s,r=s*(0.2+R()*0.2),ph=R()*6.28,a=t==null?0.5:0.25+0.4*(0.5+0.5*Math.sin(t*2.2+ph));
    const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,220,80,${a})`);g.addColorStop(1,'rgba(255,120,0,0)');c.fillStyle=g;disc(c,x,y,r);
  }
  const n=1+Math.round(R()*2);c.lineWidth=Math.max(0.8,s*0.025);
  for(let i=0;i<n;i++){
    const p=blobPts(s*(0.15+R()*0.7),s*(0.15+R()*0.7),s*(0.1+R()*0.1),s*(0.08+R()*0.08),7,0.3,R);
    c.fillStyle='rgba(50,10,4,0.85)';trace(c,p);c.fill();c.strokeStyle='rgba(255,150,30,0.6)';c.stroke();
  }
  for(let i=0;i<2;i++){
    const x=s*(0.15+R()*0.7),y=s*(0.15+R()*0.7),ph=R(),per=2+R()*2;
    if(t==null)continue;
    const u=(t/per+ph)%1;
    if(u>0.85){const k=(u-0.85)/0.15;c.strokeStyle=`rgba(255,230,120,${1-k})`;c.lineWidth=Math.max(0.8,s*0.02);c.beginPath();c.arc(x,y,s*0.07*(1+k),0,6.2832);c.stroke();}
    else{const r=s*0.07*u/0.85;c.fillStyle='#ffb040';disc(c,x,y,r);c.fillStyle='rgba(255,250,200,0.7)';disc(c,x-r*0.3,y-r*0.3,r*0.35);}
  }
}
function mudDetail(c,s,R){ // manchas, charcos turbios con reflejo y matas de junco
  for(let i=0;i<2;i++){c.fillStyle=R()<0.5?'rgba(30,24,10,0.3)':'rgba(90,95,40,0.25)';disc(c,R()*s,R()*s,s*(0.15+R()*0.2));}
  const k=1+Math.round(R());c.lineWidth=Math.max(0.8,s*0.02);
  for(let i=0;i<k;i++){
    const x=s*(0.2+R()*0.6),y=s*(0.2+R()*0.6),p=blobPts(x,y,s*(0.12+R()*0.1),s*(0.08+R()*0.06),7,0.3,R);
    c.fillStyle='rgba(40,58,40,0.85)';trace(c,p);c.fill();c.strokeStyle='rgba(20,16,6,0.6)';c.stroke();
    c.fillStyle='rgba(200,220,190,0.25)';c.beginPath();c.ellipse(x-s*0.03,y-s*0.02,s*0.04,s*0.012,0,0,6.2832);c.fill();
  }
  const n=Math.round(4*s/44);c.strokeStyle='#3c5a22';c.lineWidth=Math.max(0.8,s*0.022);c.lineCap='round';
  for(let i=0;i<n;i++){const x=R()*s,y=R()*s,h=s*(0.08+R()*0.08);c.beginPath();c.moveTo(x,y);c.lineTo(x-h*0.3,y-h);c.moveTo(x,y);c.lineTo(x+h*0.25,y-h*0.9);c.stroke();}
}
function iceDetail(c,s,R){ // grietas que pueden pasar a la celda vecina y un destello
  c.lineCap='round';c.lineJoin='round';
  for(let i=0;i<2;i++){
    let x=R()*s,y=R()*s;const pts=[[x,y]];let a=R()*6.28;
    for(let j=0;j<3;j++){a+=(R()-0.5)*1.2;x+=Math.cos(a)*s*0.25;y+=Math.sin(a)*s*0.25;pts.push([x,y]);}
    for(const[st,lw,o]of[['rgba(30,90,120,0.45)',Math.max(1,s*0.03),0.6],['rgba(255,255,255,0.8)',Math.max(0.7,s*0.015),0]]){
      c.strokeStyle=st;c.lineWidth=lw;c.beginPath();pts.forEach(([px,py],k)=>k?c.lineTo(px+o,py+o):c.moveTo(px+o,py+o));c.stroke();
    }
  }
  c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=Math.max(1,s*0.025);
  const gx=s*(0.15+R()*0.5),gy=s*(0.15+R()*0.5);c.beginPath();c.moveTo(gx,gy+s*0.12);c.lineTo(gx+s*0.12,gy);c.stroke();
}
function bloodDetail(c,s,R){ // brillo húmedo
  const x=s*(0.25+R()*0.5),y=s*(0.25+R()*0.5),on=R()<0.6;
  if(on){c.fillStyle='rgba(255,210,210,0.3)';c.beginPath();c.ellipse(x,y,s*0.07,s*0.03,-0.5,0,6.2832);c.fill();}
}
function acidDetail(c,s,R,t){ // brillo y burbujas (animadas: crecen y revientan)
  const hx=s*(0.25+R()*0.5),hy=s*(0.25+R()*0.5);
  c.fillStyle='rgba(235,255,200,0.35)';c.beginPath();c.ellipse(hx,hy,s*0.07,s*0.03,-0.5,0,6.2832);c.fill();
  c.lineWidth=Math.max(0.7,s*0.015);
  for(let i=0;i<3;i++){
    const x=s*(0.15+R()*0.7),y=s*(0.15+R()*0.7),ph=R(),per=1.5+R()*1.5,br=s*0.035;
    if(t==null){c.strokeStyle='rgba(210,255,160,0.6)';c.beginPath();c.arc(x,y,br*0.6,0,6.2832);c.stroke();continue;}
    const u=(t/per+ph)%1;
    if(u>0.8){const k=(u-0.8)/0.2;c.strokeStyle=`rgba(210,255,160,${0.8*(1-k)})`;c.beginPath();c.arc(x,y,br*(1+k),0,6.2832);c.stroke();}
    else{c.fillStyle='rgba(190,255,120,0.75)';disc(c,x,y,br*u/0.8);}
  }
}
function shallowDetail(c,s,R,t){ // fondo de piedritas que se ve a través del agua y reflejos de luz (animados: se mueven)
  for(let i=0;i<4;i++){const x=R()*s,y=R()*s,rx=s*(0.03+R()*0.04),v=R();c.fillStyle=v<0.5?'rgba(110,120,125,0.55)':'rgba(140,120,85,0.5)';c.beginPath();c.ellipse(x,y,rx,rx*0.7,R()*3,0,6.2832);c.fill();}
  c.lineWidth=Math.max(1,s*0.02);c.lineCap='round';
  for(let i=0;i<3;i++){
    const x=R()*s,y=R()*s,w=s*(0.2+R()*0.15),ph=R()*6.28,dx=t==null?0:Math.sin(t*0.9+ph)*s*0.08,a=t==null?0.25:0.12+0.18*(0.5+0.5*Math.sin(t*1.6+ph));
    c.strokeStyle=`rgba(255,255,255,${a})`;c.beginPath();c.moveTo(x+dx-w/2,y);c.bezierCurveTo(x+dx-w/6,y-w*0.3,x+dx+w/6,y+w*0.3,x+dx+w/2,y);c.stroke();
  }
}
function dirtyDetail(c,s,R,t){ // agua sucia: espuma verdosa, restos flotando y burbujas (animadas: suben y revientan)

// Pisos con forma, de abajo hacia arriba. El vacío va abajo de todo: el agua que lo toca cae sobre el abismo. El agua

const LIQ_BASE_ORDER=['void','mud','dirty','shallow','water','ice','lava'], LIQ_OVER=['blood','acid','oil','cloud'], LIQ_DEEP_W=2.2;

const liqNoise=(x,y,salt)=>0.7*vnoise(x*0.5,y*0.5,salt)+0.3*vnoise(x*1.5,y*1.5,salt+77);

function vnoise(x,y,salt){

// Contorno val(i,j) >= thr sobre la rejilla de muestras (n por celda) de las celdas proc, como un solo Path2D.
// Cada subcuadrado aporta su parte de adentro como polígono en sentido horario; una celda entera adentro, un rect.
function liqPath(val,thr,proc,n,st,sx,sy){

  for(const[ci,ri]of proc){

    if(none)continue;
    if(all){p.rect(sx(i0),sy(j0),CSn,CSn);continue;}
    for(let j=j0;j<j0+n;j++){
     let run=-1; // tira de subcuadrados enteros adentro: un solo rect (menos llamadas a Path2D)
     for(let i=i0;i<=i0+n;i++){
      const a=i<i0+n?val(i,j):0,b=i<i0+n?val(i+1,j):0,cc=i<i0+n?val(i+1,j+1):0,d=i<i0+n?val(i,j+1):0;

      if(i===i0+n||(a<thr&&b<thr&&cc<thr&&d<thr))continue;

    }

// Campo suavizado de una ocupación (W×H celdas) sobre la rejilla de muestras ((W·n+1)×(H·n+1)), en dos pasadas
// separables (primero filas, después columnas): la rampa es la misma en x y en y.
function liqConv(occ,W,H,n,w){
  const LW=W*n+1,LH=H*n+1,rad=0.5+w/2;
  const taps=(N,cells)=>{const t=[];for(let i=0;i<N;i++){const x=i/n,a=[];
    for(let c=Math.max(0,Math.floor(x-0.5-rad)+1);c<=Math.min(cells-1,Math.ceil(x-0.5+rad)-1);c++){const k=liqK(x-c-0.5,w);if(k>0)a.push(c,k);}
    t.push(a);}return t;};

// zoom + huella de la ocupación del bloque y su margen. Al mover la vista o pintar otra cosa se reusan; al pintar un
// líquido solo se recalculan los bloques cuyo margen incluye esa celda. Los bloques se unen en un solo Path2D por banda

function liqChunk(type,shapeG,G,cx,cy){

// Arma la mancha de un líquido: shape = ocupación para la forma, own = sus propias celdas (detalle y gotas).

// Formas redondas (L.round, el vacío): campo = una gota por copa (como los árboles: 2×2 = un círculo grande) más una por
// cada celda prestada de un líquido de arriba. Depende de cómo se agrupa todo el terreno, así que no va por bloques
// cacheados: se calcula para el área de trabajo en cada armado (es poco).

    const R=Rk*n,px=cx*n,py=cy*n;

function liqRegion(type,shape,own,G,animSet){
  const L=LIQ[type],salt=terrSalt(type),K=LIQ_CHUNK;
  let paths;
  const occ=(arr,c,r)=>{c-=G.c0;r-=G.r0;return c>=0&&r>=0&&c<G.W&&r<G.H&&arr[r*G.W+c]===1;};
  if(L.round)paths=liqRoundPaths(type,shape,own,G,treeCrowns(G.ox,G.oy,type));
  else{
    paths=L.bands.map(()=>new Path2D());
    for(let cy=G.ky0;cy<=G.ky1;cy++)for(let cx=G.kx0;cx<=G.kx1;cx++){
      const cp=liqChunk(type,shape,G,cx,cy);if(!cp)continue;
      const m=new DOMMatrix().translateSelf((cx*K-G.ox)*CS,(cy*K-G.oy)*CS);
      cp.forEach((p,b)=>paths[b].addPath(p,m));

  }

  const proc=[];
  for(let r=G.oy-1;r<=G.oy+ROWS;r++)for(let c=G.ox-1;c<=G.ox+COLS;c++)if(occ(own,c,r))proc.push([c-G.c0,r-G.r0]);

    if(!L.drops)continue;
    const R=cellRng(col,row,salt+1); // siempre la misma cantidad de R(): las gotas no cambian al pintar al lado
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){

function drawLiq(c,Rg,t){
  const L=LIQ[Rg.type];
  // Con halo, la primera banda se pinta con la sombra puesta (y no otra vez abajo: con colores translúcidos se notaría)
  if(L.glow){c.save();c.shadowColor=L.glow;c.shadowBlur=CS*0.3*terrScale;c.fillStyle=L.bands[0][2];c.fill(Rg.paths[0]);c.restore();}
  c.save();c.clip(Rg.paths[0]);
  Rg.paths.forEach((p,i)=>{if(i||!L.glow){c.fillStyle=L.bands[i][2];c.fill(p);}});
  const salt=terrSalt(Rg.type);
  for(const[col,row,an]of Rg.cells){c.save();c.translate((col-S.ox)*CS,(row-S.oy)*CS);L.detail(c,CS,cellRng(col,row,salt),an?t:null);c.restore();}
  c.restore();

// Donde el agua o el hielo tocan la lava: una costra de obsidiana sobre el borde compartido y vapor que sube
function drawContact(c,[c1,r1,c2,r2],t){
  const s=CS,mx=((c1+c2)/2+0.5-S.ox)*s,my=((r1+r2)/2+0.5-S.oy)*s,side=r1===r2; // vecinas de costado: borde vertical
  const R=cellRng(c1*3+c2,r1*3+r2,991);
  const p=blobPts(mx,my,side?s*0.2:s*0.55,side?s*0.55:s*0.2,8,0.25,R);

      const dx=q&1?1:-1,dy=q&2?1:-1;

// Dibuja la escena entera. Orden: pisos celda por celda (y lo de encima con fondo propio cuando está solo; bajo un
// líquido, sus vecinos) → pisos líquidos → línea de grilla tenue (arriba e izquierda, como el fondo de #grid, para

// Lo que un objeto necesita de sus vecinas: mesa = con qué mesas se une (N=1 E=2 S=4 O=8); silla = girar para mirar a
// la mesa de al lado (respaldo del otro lado); armero = apoyar la tabla contra la pared de al lado. Sin vecina: rot 0.
// Además: los que se apoyan en la pared (OBJ_WALL: la pared o el ladrillo de al lado queda "arriba" del dibujo), los que
// quedan girados al azar (OBJ_SPIN, siempre igual para la misma celda) y los de 2 celdas (OBJ_PAIR, ver objPairs).
// La biblioteca además se une con las bibliotecas de sus costados (links: 1 = a su izquierda, 2 = a su derecha).
const OBJ_NB={table:1,chair:1,rack:1,bed:1,coffin:1,furniture:1,shelf:1,throne:1,altar:1,torch:1,corpse:1,bones:1,signpost:1};

function objNeighbors(type,col,row,P,pairs){
  const dirs=[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]]; // N E S O
  if(type==='table'){let links=0;for(const[dx,dy,b]of dirs)if(P((col+dx)+','+(row+dy)).over==='table')links|=b;return{links,rot:0};}
  // rot: por defecto el respaldo/la tabla está arriba. Mirar al S = 0, al N = π, al E = -π/2, al O = π/2
  const rotFor={'0,1':0,'0,-1':Math.PI,'1,0':-Math.PI/2,'-1,0':Math.PI/2};
  if(type==='chair'){for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]])if(P((col+dx)+','+(row+dy)).over==='table')return{rot:rotFor[dx+','+dy]};return{rot:0};}

    let rot=0;
    for(const[dx,dy]of[[0,-1],[0,1],[1,0],[-1,0]]){const b=P((col+dx)+','+(row+dy)).base;if(b==='wall'||b==='brick'){rot=rotFor[(-dx)+','+(-dy)];break;}}

// Ataúd: se empareja de a 2 recorriendo todo el terreno fila por fila (no depende de la vista): con la de la
// derecha si está libre (cabecera a la izquierda), si no con la de abajo (cabecera arriba); si no, va sola (versión
// chica). part: 0 = cabecera, 1 = pies, 2 = sola. El dibujo ocupa 2 celdas hacia "abajo" desde la cabecera.
function objPairs(){
  const out=new Map(),by={};
  for(const k in S.terrain){const o=parseTerr(S.terrain[k]).over;if(OBJ_PAIR[o]){(by[o]||(by[o]=[])).push(k.split(',').map(Number));}}
  for(const type in by){
    const cells=by[type].sort((a,b)=>a[1]-b[1]||a[0]-b[0]),has=new Set(cells.map(([c,r])=>c+','+r)),taken=new Set();
    for(const[c,r]of cells){
      const k=c+','+r;if(taken.has(k))continue;taken.add(k);
      const right=(c+1)+','+r,down=c+','+(r+1);
      if(has.has(right)&&!taken.has(right)){taken.add(right);out.set(k,{part:0,rot:-Math.PI/2});out.set(right,{part:1,rot:-Math.PI/2});}
      else if(has.has(down)&&!taken.has(down)){taken.add(down);out.set(k,{part:0,rot:0});out.set(down,{part:1,rot:0});}

// Pisos celda por celda. Los que no se animan se dibujan una sola vez en Sc.baseImg (al armar la escena) y cada cuadro

// encima con fondo propio, vecinos debajo de un líquido, zoom y escala): al pintar o mover la vista solo se dibujan las
// celdas nuevas y el resto se copia. null = nada que dibujar.

  const s=CS,tex=(type,x,y,col,row,tt,under,clip)=>terrTex(c,type,x,y,col,row,tt,under,clip);

/* Árboles: copas redondas (más que los líquidos). Las celdas de árbol se agrupan en copas recorriendo todo el terreno en

   y si no, la celda sola es una copa chica. Depende solo de dónde hay árboles, no de la vista: no cambia con el pan.
   En un grupo de TREE_WILD_MIN árboles o más (zona extensa), cada copa elige su tamaño al azar (sale de la coordenada:
   igual para todos) y varía un poco tamaño y centro, para que parezca un bosque natural.
