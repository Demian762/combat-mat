<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Combat Mat — D&D Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
:root { --amber:#c8922a; --amber-lt:#f0c060; --amber-dim:rgba(200,146,42,0.2); --cs:44px; --view:880px; --panel:rgba(8,6,4,0.97); --border:rgba(200,146,42,0.22); }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#141414; overflow:hidden; width:100vw; height:100vh; font-family:'EB Garamond',serif; display:flex; align-items:center; justify-content:center; }
#app { display:flex; align-items:stretch; gap:0; box-shadow:0 0 60px rgba(0,0,0,0.8); }
#grid-wrap { position:relative; flex-shrink:0; }
#grid { position:relative; box-sizing:content-box; overflow:hidden; width:var(--view); height:var(--view); border:2px solid var(--amber); border-left:none; border-right:none; }
#grid { cursor:grab; }
#grid.panning { cursor:grabbing; }
#grid.painting { cursor:crosshair; }
/* Mapa del mundo: tapa el mat (por debajo de los dados), local por cliente */
#world-map { position:absolute; top:2px; left:0; width:var(--view); height:var(--view); z-index:35; background:#0a0805 url('mapa.jpg') center/contain no-repeat; display:none; cursor:grab; overflow:hidden; }
#world-map.panning { cursor:grabbing; }
body.show-map #world-map { display:block; }
body.show-map #arrow-svg { display:none; }
.scene-row { display:flex; gap:4px; align-items:stretch; }
.scene-row #scene-select { flex:1; min-width:0; }
#map-toggle { flex-shrink:0; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:rgba(255,255,255,0.45); border-radius:4px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:.5px; text-transform:uppercase; padding:0 7px; cursor:pointer; }
#map-toggle:hover { color:rgba(255,255,255,0.75); }
#map-toggle.on { background:rgba(200,146,42,0.18); border-color:var(--amber); color:var(--amber-lt); }
/* --n = casillas por lado que ocupa la ficha (Grande 2, Enorme 3, Gargantuesco 4); --b = tamaño del cuerpo en casillas (Diminuto 0.5) */
.token { position:absolute; width:calc(var(--cs)*var(--n,1)); height:calc(var(--cs)*var(--n,1)); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; user-select:none; z-index:var(--z,10); transform-origin:50% 90%; }
/* Varias fichas en la misma celda: abanico tipo mano de cartas (layoutStacks). Solo el cuerpo recibe el mouse,
   así la franja visible de cada ficha de abajo sigue siendo clickeable */
.token.stacked, .token.tok-tiny { pointer-events:none; }
.token.stacked .tbody, .token.tok-tiny .tbody { pointer-events:auto; }
.token:hover { filter:brightness(1.35); z-index:20; }
.token.selected { z-index:30; }
.token.dragging { cursor:grabbing; z-index:100; opacity:.85; }
body.tok-dragging, body.tok-dragging * { cursor:none !important; }
/* Ficha = 9/11 de la celda (36px a 44px), escala con el nivel de zoom */
.tbody { width:calc(var(--cs)*var(--b,1)*9/11); height:calc(var(--cs)*var(--b,1)*9/11); display:flex; align-items:center; justify-content:center; font-size:calc(var(--cs)*var(--b,1)*4/11); position:relative; }
.token-player .tbody { border-radius:50%; border:2px solid; }
/* Ficha seleccionada: el brillo late (sel-pulse-*) para ubicarla rápido. drawTok fija animation-delay según el reloj
   para que el latido no se reinicie cada vez que la ficha se vuelve a dibujar. */
@keyframes sel-pulse-player {
  0%,100% { box-shadow:0 0 0 2px var(--amber-lt),0 0 6px 1px rgba(200,146,42,0.55); }
  50%     { box-shadow:0 0 0 3px #fff3c4,0 0 22px 8px rgba(240,192,96,0.95); }
}
@keyframes sel-pulse-enemy {
  0%,100% { box-shadow:0 0 0 2px rgba(255,85,85,0.8),0 0 6px 1px rgba(255,60,60,0.45); }
  50%     { box-shadow:0 0 0 3px #ffb0b0,0 0 22px 8px rgba(255,60,60,0.95); }
}
.token-player.selected .tbody { animation:sel-pulse-player 1.2s ease-in-out infinite; }
.token-enemy .tbody { border-radius:4px; background:rgba(90,8,8,0.88); border:2px solid rgba(180,40,40,0.75); box-shadow:0 0 10px rgba(180,30,30,0.4); }
.token-enemy.selected .tbody { border-color:#ff5555; animation:sel-pulse-enemy 1.2s ease-in-out infinite; }
.tcell { position:absolute; width:var(--cs); height:var(--cs); z-index:5; pointer-events:none; }

/* Left panel */
#left { width:260px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:2px solid var(--amber); display:flex; flex-direction:column; overflow:hidden; height:calc(var(--view) + 4px); }
/* Combatientes y (solo master) Baúl: mitades iguales, cada lista con su propio scroll */
.left-half { flex:1 1 0; min-height:0; display:flex; flex-direction:column; }
/* Divisor arrastrable Combatientes / Baúl de personajes (solo master); la proporción se guarda en localStorage ('leftSplit') */
#left-split { flex:0 0 7px; cursor:row-resize; display:flex; align-items:center; justify-content:center; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:rgba(255,255,255,0.02); }
#left-split::before { content:''; width:36px; height:3px; border-radius:2px; background:rgba(200,146,42,0.45); }
#left-split:hover, #left-split.dragging { background:rgba(200,146,42,0.15); }
#left-split:hover::before, #left-split.dragging::before { background:var(--amber-lt); }
body:not(.is-master) #left-split { display:none; } /* el id le gana a .master-only: ocultarlo explícitamente */
body.split-dragging, body.split-dragging * { cursor:row-resize !important; user-select:none; }
body.is-master #combat-section { border-bottom:none; }
#left-list, #chest-list { flex:1; min-height:0; overflow-y:auto; }
#left-list::-webkit-scrollbar, #chest-list::-webkit-scrollbar { width:3px; }
#left-list::-webkit-scrollbar-thumb, #chest-list::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.left-half.drop-zone { background:rgba(200,146,42,0.08); outline:1px dashed var(--amber); outline-offset:-4px; }
.chest-item { padding-left:10px; }
.chest-hp { font-family:'Cinzel',serif; font-size:9px; color:rgba(200,160,80,0.7); }
.litem { padding:7px 10px 7px 0; border-bottom:1px solid var(--border); cursor:grab; user-select:none; transition:background .1s; display:flex; align-items:flex-start; gap:0; }
.litem:last-child { border-bottom:none; }
.litem.dragging-item { opacity:.4; }
.litem.drag-over { border-top:2px solid var(--amber-lt); }
.litem.litem-turn { background:rgba(200,146,42,0.07); border-left:2px solid var(--amber); }
.litem-left { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; width:36px; flex-shrink:0; padding-top:2px; border-right:1px solid var(--border); margin-right:8px; }
.litem-num { font-family:'Cinzel',serif; font-size:10px; color:rgba(200,146,42,0.6); line-height:1; padding-left:0; text-align:center; width:100%; }
.litem-cb { width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(200,146,42,0.4); background:rgba(255,255,255,0.04); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; flex-shrink:0; }
.litem-cb:hover { border-color:var(--amber); }
.litem-cb.on { background:var(--amber); border-color:var(--amber-lt); box-shadow:0 0 6px rgba(200,146,42,0.6); }
.litem-body { flex:1; min-width:0; }
.litem-header { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.litem-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.litem-dot.enemy { border-radius:2px; }
.litem-name { font-family:'Cinzel',serif; font-size:10px; color:#e0d0b0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.litem-cls { font-family:'Cinzel',serif; font-size:9px; color:rgba(200,160,80,0.7); flex-shrink:0; }
.lhp-row { display:flex; align-items:center; gap:3px; min-height:20px; }
.lhp-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-family:'Cinzel',serif; font-size:10px; width:22px; height:20px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s; }
.lhp-btn:hover { background:rgba(200,146,42,0.2); }
.lhp-val { font-family:'Cinzel',serif; font-size:10px; color:#ddd; flex:1; text-align:center; }
.lhp-bar-wrap { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin-top:4px; }
.lhp-bar { height:100%; border-radius:2px; transition:width .3s,background .3s; }
.lhp-word { font-family:'Cinzel',serif; font-size:10px; letter-spacing:.5px; flex:1; text-align:center; }

/* Right panel */
#side { width:220px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-left:2px solid var(--amber); display:flex; flex-direction:column; overflow-y:auto; max-height:calc(var(--view) + 4px); }
#side::-webkit-scrollbar { width:3px; }
#side::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.section { padding:10px 12px; border-bottom:1px solid var(--border); }
.section:last-child { border-bottom:none; }
.sec-title { font-family:'Cinzel',serif; font-size:10px; color:var(--amber-lt); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; display:block; }
.sw-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.sw-grid.tok .terr-sw { height:22px; }
.pal-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.pal-head .sec-title, .pal-head .plabel { margin-bottom:0; }
.pal-mode { display:flex; margin-left:auto; border:1px solid var(--border); border-radius:3px; overflow:hidden; }
.pal-mode span { font-family:'Cinzel',serif; font-size:7px; letter-spacing:.5px; text-transform:uppercase; padding:3px 5px; color:rgba(255,255,255,0.4); cursor:pointer; }
.pal-mode span:hover { color:rgba(255,255,255,0.7); }
.pal-mode span.active { background:rgba(200,146,42,0.18); color:var(--amber-lt); }
/* Simple y Completa superpuestas en la misma celda: la sección mide siempre lo de la más alta */
.pal-stack { display:grid; }
.pal-stack > * { grid-area:1/1; align-self:start; }
.pal-stack > .pal-off { visibility:hidden; pointer-events:none; }
.pick-sq, .pick-hue { display:block; cursor:crosshair; border-radius:3px; }
.pick-sq { margin-bottom:5px; }
.terr-sw { height:28px; border-radius:3px; cursor:pointer; border:2px solid transparent; transition:border-color .12s,transform .1s; }
.terr-sw:hover { border-color:rgba(255,255,255,0.35); transform:scale(1.06); }
.terr-sw.active { border-color:#fff; box-shadow:0 0 6px rgba(255,255,255,0.25); }
.tbtn-erase { height:28px; border-radius:3px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); font-size:12px; display:flex; align-items:center; justify-content:center; transition:border-color .12s; }
.tbtn-erase:hover { border-color:rgba(255,255,255,0.3); }
.tbtn-erase.active { border-color:rgba(200,80,80,0.9); color:#e08080; background:rgba(180,40,40,0.2); }

/* Pan controls */
/* Dos mitades iguales: botones de terreno a la izquierda, flechas a la derecha, cada uno centrado en la suya */
#map-tools { display:grid; grid-template-columns:1fr 1fr; align-items:center; justify-items:center; margin-top:8px; }
#terr-tools { display:flex; flex-direction:column; gap:6px; width:50px; }
#terr-tools > .terr-sw, #terr-tools > .tbtn-erase { height:34px; }
#terr-tools > .tbtn-erase { font-size:15px; }
#terr-tools > .off { visibility:hidden; pointer-events:none; }
#pan-grid { display:grid; grid-template-columns:26px 1fr 26px; gap:3px; width:96px; }
.pan-btn { height:28px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); border-radius:4px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:background .12s; }
.pan-btn:hover { background:rgba(200,146,42,0.2); }
/* Posición de la vista (ox,oy): ámbar claro sobre recuadro oscuro para que se lea */
.pan-center { display:flex; align-items:center; justify-content:center; height:28px; font-family:'Cinzel',serif; font-size:11px; font-weight:700; color:var(--amber-lt); background:rgba(0,0,0,0.6); border:1px solid rgba(200,146,42,0.45); border-radius:4px; white-space:nowrap; letter-spacing:-.3px; text-shadow:0 1px 2px #000; cursor:pointer; user-select:none; transition:background .12s; }
.pan-center:hover { background:rgba(200,146,42,0.25); border-color:var(--amber); }

input[type=text] { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; padding:4px 7px; border-radius:4px; font-family:'EB Garamond',serif; font-size:13px; margin-bottom:6px; outline:none; }
input[type=text]:focus { border-color:var(--amber); }
/* Clase y Tamaño lado a lado */
.cls-size-row { display:flex; gap:4px; }
.cls-size-row > div { min-width:0; }
.cls-size-row > div:first-child { flex:1.3; }
.cls-size-row > div:last-child { flex:1; }
.plabel { font-family:'Cinzel',serif; font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:3px; }
.hpmax-ctrl { display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.hpmax-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:26px; height:28px; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hpmax-btn:hover { background:rgba(200,146,42,0.15); }
.hpmax-val { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; font-family:'Cinzel',serif; font-size:12px; text-align:center; border-radius:4px; height:28px; line-height:28px; }
.btn { font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; padding:6px; border-radius:4px; border:1px solid; cursor:pointer; text-transform:uppercase; width:100%; margin-bottom:4px; transition:background .15s; }
.bp { background:rgba(70,130,210,0.1); border-color:rgba(70,130,210,0.45); color:#80b4ee; }
.bp:hover { background:rgba(70,130,210,0.25); }
.be { background:rgba(170,35,35,0.1); border-color:rgba(170,35,35,0.45); color:#e07070; }
.be:hover { background:rgba(170,35,35,0.25); }
.bd { background:rgba(100,20,20,0.15); border-color:rgba(160,35,35,0.35); color:#c06060; font-size:8px; padding:4px; }
.bd:hover { background:rgba(160,35,35,0.3); }

.tdel { background:none; border:none; color:rgba(200,80,80,0.6); cursor:pointer; font-size:10px; padding:0 2px; }
.tdel:hover { color:#e07070; }
.ctrow { display:flex; gap:4px; margin-bottom:0; }
.ctbtn { flex:1; display:flex; align-items:center; gap:4px; padding:4px 5px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:border-color .12s; }
.ctbtn:hover { border-color:var(--amber-dim); }
.ctbtn.active { border-color:var(--amber); }
.ctbtn span { font-family:'Cinzel',serif; font-size:7px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:.5px; }
.cprev { width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); flex-shrink:0; }

/* Dice panel */
#dice { width:212px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:none; display:flex; flex-direction:column; max-height:calc(var(--view) + 4px); }
#dice::-webkit-scrollbar { width:3px; }
#dice::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.dice-row { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.die-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:22px; height:22px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; flex-shrink:0; }
.die-btn:hover { background:rgba(200,146,42,0.2); }
.die-pick-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:3px; color:rgba(255,255,255,0.6); font-family:'Cinzel',serif; font-size:12px; padding:8px 2px; cursor:pointer; text-align:center; transition:background .12s,border-color .12s; }
.die-pick-btn:hover { background:rgba(255,255,255,0.09); }
.die-pick-btn.has-dice { border-color:var(--amber); background:rgba(200,146,42,0.15); color:var(--amber-lt); }
.roll-btn { font-family:'Cinzel',serif; font-size:12px; letter-spacing:1.5px; padding:9px; border-radius:4px; border:1px solid var(--amber); cursor:pointer; text-transform:uppercase; width:100%; background:rgba(200,146,42,0.1); color:var(--amber-lt); transition:background .15s; margin-top:6px; }
.roll-btn:hover { background:rgba(200,146,42,0.25); }
.roll-locked { opacity:.35; cursor:not-allowed !important; pointer-events:none; }
#dplayer-fixed { width:100%; border:1px solid var(--border); color:var(--amber-lt); padding:5px 7px; border-radius:4px; font-family:'Cinzel',serif; font-size:11px; min-height:26px; box-sizing:border-box; }
#dplayer-fixed.empty { color:rgba(200,180,120,0.45); font-family:'EB Garamond',serif; font-style:italic; }
#dlog-section { background:rgba(28,14,3,0.92); border-top:1px solid var(--border); }
#dlog-section::-webkit-scrollbar { width:3px; }
#dlog-section::-webkit-scrollbar-thumb { background:rgba(200,146,42,0.4); border-radius:2px; }
.dlog-entry { padding:6px 0; border-bottom:1px solid rgba(200,146,42,0.15); }
.dlog-entry:last-child { border-bottom:none; }
.dlog-name { font-family:'Cinzel',serif; font-size:11px; color:var(--amber-lt); }
.dlog-total-val { font-family:'Cinzel',serif; font-size:18px; color:var(--amber-lt); }
.dlog-dice-str { font-family:'Cinzel',serif; font-size:10px; color:var(--amber); }
.dlog-detail-str { font-size:11px; color:rgba(180,110,30,0.75); font-family:'EB Garamond',serif; }
.vd-btn { flex:1; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.5px; padding:7px 2px; border-radius:3px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.2); cursor:default; text-transform:uppercase; transition:all .12s; text-align:center; }
#btn-vent:not([disabled]) { border-color:rgba(80,180,80,0.6); background:rgba(30,90,30,0.22); color:#90e090; cursor:pointer; }
#btn-desv:not([disabled]) { border-color:rgba(210,90,70,0.6); background:rgba(110,35,25,0.22); color:#e09078; cursor:pointer; }
.vd-btn:not([disabled]):hover { filter:brightness(1.25); }
#btn-vent.active, #btn-desv.active { border-color:var(--amber-lt); background:rgba(200,146,42,0.18); color:var(--amber-lt); box-shadow:0 0 8px rgba(200,146,42,0.35); }
#dice .sec-title { font-size:12px; }
#dice .plabel { font-size:11px; letter-spacing:.5px; }
#dbounce { width:100%; accent-color:var(--amber); margin:0 0 6px; cursor:pointer; }
#scene-select, #dplayer-name, #cls-select, #size-select { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); padding:5px 7px; border-radius:4px; font-family:'Cinzel',serif; font-size:11px; margin-bottom:6px; outline:none; cursor:pointer; appearance:none; }
#scene-select:focus, #dplayer-name:focus, #cls-select:focus, #size-select:focus { border-color:var(--amber); }
#scene-select option, #dplayer-name option, #cls-select option, #size-select option { background:#140e04; color:#ddd; }

/* Login overlay */
#login-overlay { position:fixed; inset:0; background:rgba(8,6,4,0.98); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
#login-overlay.hidden { display:none; }
#login-title { font-family:'Cinzel',serif; font-size:30px; color:var(--amber-lt); letter-spacing:5px; text-transform:uppercase; }
#login-sub { font-family:'EB Garamond',serif; font-size:16px; color:rgba(200,160,80,0.55); letter-spacing:1px; }
#btn-google { display:flex; align-items:center; gap:10px; padding:11px 28px; background:rgba(255,255,255,0.06); border:1px solid var(--amber); border-radius:5px; cursor:pointer; font-family:'Cinzel',serif; font-size:12px; letter-spacing:1.5px; color:var(--amber-lt); text-transform:uppercase; transition:background .15s; margin-top:8px; }
#btn-google:hover { background:rgba(200,146,42,0.2); }
#login-error { font-family:'EB Garamond',serif; font-size:14px; color:#e07070; display:none; text-align:center; max-width:320px; }

/* Account */

// ── Auth ──────────────────────────────────────────────────
const ALLOWED_EMAILS = [

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(result => {
    if (result && result.user) handleAuthUser(result.user);
  }).catch(err => {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    const el = document.getElementById('login-error');
    el.textContent = err.code === 'auth/popup-blocked'
      ? 'Tu navegador bloqueó la ventana de Google. Permití ventanas emergentes para este sitio e intentá de nuevo.'
      : `Error al iniciar sesión (${err.code}).`;
    el.style.display = 'block';
  });
}

// La cuenta del master puede crear personajes sin límite; el resto, uno a la vez (owner = su uid)
const MASTER_EMAIL = 'juanalbarracin92@gmail.com';
let me = null;
const isMaster = () => !!me && (TEST_MODE === null ? me.email === MASTER_EMAIL : TEST_MODE === 'master');

function signOutUser() {
  auth.signOut();
}

let appReady = false;

function handleAuthUser(user) {
  const overlay = document.getElementById('login-overlay');
  const errorEl = document.getElementById('login-error');
  const accountEmail = document.getElementById('account-email');
  const logoutSection = document.getElementById('logout-section');
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    me = user;
    overlay.classList.add('hidden');
    accountEmail.textContent = user.email;
    logoutSection.classList.remove('hidden');
    if (!appReady) { appReady = true; initFirebase(); fitApp(); }
    refreshPlayerControls();
  } else if (user) {
    errorEl.textContent = `Acceso denegado: ${user.email} no está autorizado.`;
    errorEl.style.display = 'block';
    logoutSection.classList.add('hidden');
    auth.signOut();
  } else {
    overlay.classList.remove('hidden');
    logoutSection.classList.add('hidden');
  }
}

auth.onAuthStateChanged(user => handleAuthUser(user));

// ─────────────────────────────────────────────────────────
const PAGE_LOAD_TS = Date.now();
// ─────────────────────────────────────────────────────────

// Iconos por clase para mostrar en fichas y panel izquierdo
const ICONS={'Bárbaro':'⚔','Bardo':'♪','Clérigo':'†','Druida':'✿','Guerrero':'⛊','Monje':'○','Paladín':'✦','Pícaro':'◈','Hechicero':'⬡','Brujo':'◉','Mago':'✧','Explorador':'◎','Artífice':'⚙','Otras':'?'};
const CLASS_LIST=['Bárbaro','Bardo','Clérigo','Druida','Guerrero','Monje','Paladín','Pícaro','Hechicero','Brujo','Mago','Explorador','Artífice','Otras'];
// Terrenos con nombre: name = tooltip, sw = color de la muestra en la paleta, bg = color en el mat.
// En /terrain también puede guardarse un hex '#rrggbb' (pintado con la paleta Completa).
const TERRAIN={
  wall:{name:'Pared',sw:'#161412',bg:'rgba(22,20,18,0.92)'},stone:{name:'Piedra',sw:'#64646e',bg:'rgba(100,100,110,0.82)'},door:{name:'Puerta',sw:'#5a300c',bg:'rgba(90,48,12,0.88)'},
  fence:{name:'Cerca',sw:'#b48c3c',bg:'rgba(180,140,60,0.78)'},tree:{name:'Árbol',sw:'#10340e',bg:'rgba(16,52,14,0.90)'},grass:{name:'Hierba',sw:'#3a6e22',bg:'rgba(58,110,34,0.72)'},
  water:{name:'Agua',sw:'#123aa0',bg:'rgba(18,58,160,0.78)'},ice:{name:'Hielo',sw:'#78c8dc',bg:'rgba(120,200,220,0.72)'},
  fire:{name:'Fuego',sw:'#be3c08',bg:'rgba(190,60,8,0.82)'},lava:{name:'Lava',sw:'#c81400',bg:'rgba(200,20,0,0.88)'},trap:{name:'Trampa',sw:'#640606',bg:'rgba(100,6,6,0.86)'},sand:{name:'Arena',sw:'#bea564',bg:'rgba(190,165,100,0.72)'},
  snow:{name:'Nieve',sw:'#eef2f8',bg:'rgba(230,238,248,0.88)'},metal:{name:'Metal',sw:'#7a8490',bg:'rgba(100,112,126,0.88)'},
};
const isHexColor=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
// Paleta simple de personajes: colores vivos y claros
const TOK_COLORS=[['Rojo','#e53935'],['Naranja','#fb8c00'],['Amarillo','#fdd835'],['Lima','#9ccc65'],['Verde','#43a047'],
  ['Celeste','#4fc3f7'],['Azul','#4a90e2'],['Violeta','#9c5bd6'],['Rosa','#f06292'],['Blanco','#f5f5f5']];
// Viewport de VIEW px fijos (= --view en CSS). Lo que cambia con el zoom (rueda sobre el mat) es cuántas celdas entran:
// nivel 1 = 10×10 (celdas de 88px), nivel 2 = 20×20 (44px, el original), nivel 3 = 40×40 (22px). Estado local por cliente.
const VIEW=880, ZOOM_CELLS={1:10,2:20,3:40};
let zoomLevel=2, COLS=20, ROWS=20;
// Dimensiones naturales de #app (usadas para escalar al tamaño de ventana)
const APP_W=1572, APP_H=884;
let appZoom=1;
// Estado HSV de cada picker de color. 'player' = color activo para nuevos jugadores, local por cliente (no sincroniza)
const pickerStates={player:hexToHsv('#4a90e2'),bg:{h:20,s:0.55,v:0.04},line:{h:35,s:0.65,v:0.72}};
// mapTarget = qué pinta la paleta de arriba (terrain|bg|line). terrCustom = color del pincel de terreno en modo Completa.
// palMode = Simple/Completa de cada paleta, preferencia local en localStorage ('palMode').
let mapTarget='terrain', terrCustom={h:30,s:0.5,v:0.5}, palMode={map:'simple',tok:'simple'};
let mapPicker=null, tokPicker=null;
let lastBrush=null; // último pincel de terreno elegido, lo muestra el botón de terreno actual (null = color libre)

// Tamaños D&D 5e: n = casillas por lado que ocupa (col,row = esquina superior izquierda); b = cuerpo en casillas.
// Diminuto ocupa ¼ de casilla: entran 4 por casilla (layoutStacks las acomoda en cuadrantes). Sin `size` = Mediano.
const SIZES={tiny:{name:'Diminuto',n:1,b:0.5},small:{name:'Pequeño',n:1,b:0.75},medium:{name:'Mediano',n:1,b:1},
  large:{name:'Grande',n:2,b:2},huge:{name:'Enorme',n:3,b:3},gargantuan:{name:'Gargantuesco',n:4,b:4}};
const tokSize=t=>SIZES[t&&t.size]||SIZES.medium;

// Celdas absolutas que ocupa una ficha
function footprint(t){const n=tokN(t),a=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)a.push((t.col+c)+','+(t.row+r));return a;}
// ¿Entra una ficha de n×n con esquina en (c,r) sin pisar `taken`?
function fitsAt(c,r,n,taken){for(let dr=0;dr<n;dr++)for(let dc=0;dc<n;dc++)if(taken.has((c+dc)+','+(r+dr)))return false;return true;}

let S={tokens:[],terrain:{},ox:0,oy:0,selId:null,maxHp:10,activeTerrain:null,selectedColor:'#4a90e2',order:[],turn:null};

  const sel=document.getElementById('cls-select');

/* ── Color utils ── */
function hsvToRgb(h,s,v){const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60),p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function hsvToHex(h,s,v){return rgbToHex(...hsvToRgb(h,s,v));}
function hexToHsv(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  let h=0;
  if(d){h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}
  return{h,s:mx?d/mx:0,v:mx};
}
const hsvHex=p=>hsvToHex(p.h,p.s,p.v);
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ── Selector HSV (cuadrado saturación/brillo + barra de tono) ── */
// Una instancia por paleta. onPick(hsv) se llama cuando el usuario lo mueve; set(hsv) lo posiciona sin avisar.
function makeHsvPicker(sqId,hueId,onPick){
  const sq=document.getElementById(sqId),hc=document.getElementById(hueId);
  const p={h:0,s:0,v:0};
  function draw(){
    const W=sq.width,H=sq.height,ctx=sq.getContext('2d');
    const[r,g,b]=hsvToRgb(p.h,1,1);
    ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(0,0,W,H);
    const wg=ctx.createLinearGradient(0,0,W,0);wg.addColorStop(0,'rgba(255,255,255,1)');wg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const cx=p.s*W,cy=(1-p.v)*H;
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.stroke();
    const hctx=hc.getContext('2d'),hg=hctx.createLinearGradient(0,0,hc.width,0);
    for(let i=0;i<=360;i+=30)hg.addColorStop(i/360,`hsl(${i},100%,50%)`);
    hctx.fillStyle=hg;hctx.fillRect(0,0,hc.width,hc.height);
    hctx.beginPath();hctx.arc(p.h/360*hc.width,hc.height/2,5,0,Math.PI*2);hctx.strokeStyle='#fff';hctx.lineWidth=2;hctx.stroke();
  }
  // getBoundingClientRect ya incluye el zoom de #app; se normaliza a 0..1
  function onSq(e){const r=sq.getBoundingClientRect();p.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));p.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));draw();onPick({...p});}
  function onH(e){const r=hc.getBoundingClientRect();p.h=Math.max(0,Math.min(359,(e.clientX-r.left)/r.width*360));draw();onPick({...p});}
  let sqD=false,hD=false;
  sq.addEventListener('mousedown',e=>{sqD=true;onSq(e);e.stopPropagation();});
  hc.addEventListener('mousedown',e=>{hD=true;onH(e);e.stopPropagation();});
  document.addEventListener('mousemove',e=>{if(sqD)onSq(e);if(hD)onH(e);});
  document.addEventListener('mouseup',()=>{sqD=false;hD=false;});
  return{set(hsv){p.h=hsv.h;p.s=hsv.s;p.v=hsv.v;draw();}};
}

/* ── Paletas: Mapa (terreno/fondo/líneas) arriba, Personaje abajo ── */

// Color de la grilla (fondo o líneas) de la escena activa: se aplica al instante y se escribe en Firebase con debounce

function applyGridColors(){

/* ── Pan ── */
function pan(dx,dy){
  S.ox+=dx; S.oy+=dy;
  document.getElementById('coord-lbl').textContent=`${S.ox},${S.oy}`;
  clearArrow();
  renderTerrain(); renderAllToks();
}

// Centro de las flechas: vuelve a la vista inicial (zoom nivel 2, esquina en 0,0)
function resetView(){setZoomLevel(2);pan(-S.ox,-S.oy);}

/* ── Zoom (3 niveles, sin animación) ── */
// (px,py) = punto del mat en px sin el zoom de #app; la celda bajo ese punto queda (casi) fija al cambiar de nivel
function setZoomLevel(lv,px=VIEW/2,py=VIEW/2){
  if(!ZOOM_CELLS[lv]||lv===zoomLevel)return;
  const oldCS=CS;
  zoomLevel=lv; COLS=ROWS=ZOOM_CELLS[lv]; CS=VIEW/COLS;
  document.documentElement.style.setProperty('--cs',CS+'px');
  S.ox=Math.round(S.ox+px/oldCS-px/CS);
  S.oy=Math.round(S.oy+py/oldCS-py/CS);
  document.getElementById('coord-lbl').textContent=`${S.ox},${S.oy}`;
  clearArrow(); applyGridColors();
  renderTerrain(); renderAllToks();
}
// Rueda arriba = acercar (nivel 1), abajo = alejar (nivel 3). Un gesto continuo (trackpad) cuenta como un solo paso.
let zoomLockUntil=0;
grid.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=performance.now();
  if(now<zoomLockUntil){zoomLockUntil=now+150;return;}
  if(!e.deltaY)return;
  zoomLockUntil=now+150;
  const r=grid.getBoundingClientRect();
  setZoomLevel(zoomLevel+(e.deltaY<0?-1:1),(e.clientX-r.left)/appZoom,(e.clientY-r.top)/appZoom-2);
},{passive:false});

/* ── Terrain ── */
// type = nombre de TERRAIN, 'eraser' o un hex '#rrggbb'. Volver a elegir el mismo apaga el pincel.
function selectTerrain(type){
  S.activeTerrain=S.activeTerrain===type?null:type;
  updateTerrainUI();
}
function curBrush(){return lastBrush||hsvHex(terrCustom);}
function updateTerrainUI(){
  const a=S.activeTerrain;
  document.querySelectorAll('[data-terr]').forEach(el=>el.classList.toggle('active',el.dataset.terr===a));
  // Botón de terreno actual: el último pincel elegido (terreno con nombre o color libre); clic = prenderlo/apagarlo
  if(a&&a!=='eraser')lastBrush=a;
  const lb=curBrush();
  const bc=document.getElementById('brush-custom');
  bc.style.background=isHexColor(lb)?lb:TERRAIN[lb]?.sw||'transparent';
  bc.title=isHexColor(lb)?'Pintar con este color':TERRAIN[lb]?.name||'';
  bc.classList.toggle('active',a===lb);
  // ✕ y terreno actual solo tienen sentido con destino Terreno
  document.querySelector('#terr-tools .tbtn-erase').classList.toggle('off',mapTarget!=='terrain');
  bc.classList.toggle('off',mapTarget!=='terrain');
  document.getElementById('cprev-terrain').style.background=
    !a||a==='eraser'?'transparent':isHexColor(a)?a:TERRAIN[a]?.sw||'transparent';
  grid.classList.toggle('painting',!!a);
}
// Convierte coordenadas de mouse a celda absoluta (col+ox, row+oy) y pinta/borra terreno
function paintCell(e){
  const rect=grid.getBoundingClientRect();
  const z=CS*appZoom;
  const sc=Math.floor((e.clientX-rect.left)/z);
  const sr=Math.floor((e.clientY-rect.top-2*appZoom)/z);
  if(sc<0||sc>=COLS||sr<0||sr>=ROWS)return;
  const col=sc+S.ox, row=sr+S.oy;
  const key=`${col},${row}`;
  if(S.activeTerrain==='eraser'){
    delete S.terrain[key];
    db.ref(ROOT+'/scenes/'+activeScene+'/terrain/'+key).remove();
  }else{
    S.terrain[key]=S.activeTerrain;
    db.ref(ROOT+'/scenes/'+activeScene+'/terrain/'+key).set(S.activeTerrain);
  }
  renderTerrain();
}
// Solo renderiza las celdas visibles en el viewport actual (ox..ox+COLS, oy..oy+ROWS)
function renderTerrain(){
  document.querySelectorAll('.tcell').forEach(el=>el.remove());
  Object.entries(S.terrain).forEach(([key,type])=>{
    const bg=TERRAIN[type]?.bg||(isHexColor(type)?hexToRgba(type,0.85):null);if(!bg)return;
    const[ac,ar]=key.split(',').map(Number);
    const sc=ac-S.ox, sr=ar-S.oy;
    if(sc<0||sc>=COLS||sr<0||sr>=ROWS)return;
    const el=document.createElement('div');el.className='tcell';
    el.style.cssText=`left:${sc*CS}px;top:${sr*CS}px;background:${bg}`;
    grid.appendChild(el);
  });
}
function clearTerrain(){
  S.terrain={};
  db.ref(ROOT+'/scenes/'+activeScene+'/terrain').remove();
  renderTerrain();
}

grid.addEventListener('mousedown',e=>{if(!S.activeTerrain||e.target.closest('.token'))return;terrainPainting=true;paintCell(e);e.stopPropagation();});

// Arrastrar el terreno (sin pincel activo, fuera de las fichas) = pan, igual que las flechas: de a una casilla entera,
// el mapa sigue al cursor. ox/oy siguen siendo enteros y locales.
let gridPan=null;
grid.addEventListener('mousedown',e=>{
  if(e.button!==0||S.activeTerrain||e.target.closest('.token'))return;
  e.preventDefault();
  gridPan={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy};
  grid.classList.add('panning');
});
document.addEventListener('mousemove',e=>{
  if(!gridPan)return;
  const z=CS*appZoom;
  const tx=gridPan.ox-Math.round((e.clientX-gridPan.x)/z), ty=gridPan.oy-Math.round((e.clientY-gridPan.y)/z);
  if(tx!==S.ox||ty!==S.oy)pan(tx-S.ox,ty-S.oy);
});
document.addEventListener('mouseup',()=>{if(gridPan){gridPan=null;grid.classList.remove('panning');}});

/* ── Grid init ── */
function initGrid(){

// Retorna '#000' o '#fff' según luminosidad percibida (WCAG) del color hex
function contrastColor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)>140?'#000':'#fff';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ── Tokens ── */
function adjMaxHp(d){
  S.maxHp=Math.max(1,Math.min(999,S.maxHp+d));
  document.getElementById('ihp-val').textContent=S.maxHp;
}

function tokToFb(t){const{_el,...r}=t;return r;}

function uniqueName(base){
  const names=new Set([...S.tokens,...chest].map(t=>t.name.toLowerCase()));
  if(!names.has(base.toLowerCase()))return base;
  let n=2;while(names.has(`${base} ${n}`.toLowerCase()))n++;
  return `${base} ${n}`;
}
// Personaje propio del jugador conectado (nunca para el master)
function myChar(){
  if(!me||isMaster())return null;
  return S.tokens.find(t=>t.type==='player'&&t.owner===me.uid)||null;
}
let creatingChar=false;
// Master borra cualquier ficha; un jugador solo su propio personaje
const canDelete=t=>isMaster()||(!!me&&t.type==='player'&&t.owner===me.uid);
// Misma regla para la vida: un jugador solo ajusta la de su propio personaje (la de los demás la ve, sin botones)
const canEditHp=canDelete;
function refreshPlayerControls(){
  document.body.classList.toggle('is-master',isMaster());
  const btn=document.getElementById('btn-add-player');if(!btn)return;
  btn.textContent=isMaster()?'+ NPC':'+ Jugador'; // los personajes del master son NPCs (van al baúl)

  btn.style.opacity=locked?'0.4':'';
  btn.style.cursor=locked?'not-allowed':'';

const canRoll=()=>isMaster()||!!myChar();
// Nombre con el que se tira: el master elige del dropdown, el jugador tira siempre como su personaje
function rollerName(){
  if(!isMaster()){const t=myChar();return t?t.name:null;}
  return document.getElementById('dplayer-name').value.trim()||'Master';
}
async function addTok(type){
  if(type==='enemy'&&!isMaster())return;
  if(type==='player'&&!isMaster()){
    if(creatingChar||myChar())return;
    creatingChar=true;refreshPlayerControls();
  }
  try{await createTok(type);}
  finally{if(type==='player'){creatingChar=false;refreshPlayerControls();}}
}
// Celda libre (sin fichas de la escena activa) dentro del viewport; prefiere `pref` si sirve
// n = casillas por lado de la ficha a ubicar (todo su cuadrado tiene que estar libre y a la vista)
function freeCellInView(pref,n=1){
  const taken=new Set(getOrdered().flatMap(footprint));
  const inView=(c,r)=>c>=S.ox&&c+n<=S.ox+COLS&&r>=S.oy&&r+n<=S.oy+ROWS;
  if(pref&&inView(pref.col,pref.row)&&fitsAt(pref.col,pref.row,n,taken))return{col:pref.col,row:pref.row};
  for(let r=S.oy;r+n<=S.oy+ROWS;r++)for(let c=S.ox;c+n<=S.ox+COLS;c++)if(fitsAt(c,r,n,taken))return{col:c,row:r};
  return{col:S.ox,row:S.oy};
}
async function createTok(type){
  const input=document.getElementById('iname').value.trim();
  const base=input?input.slice(0,18):type==='enemy'?'Enemigo':'Jugador';
  const name=uniqueName(base);
  const color=type==='player'?S.selectedColor:'#7a1414';
  const size=selectedSize;
  const {col,row}=freeCellInView(null,SIZES[size].n);
  const uidSnap=await db.ref(ROOT+'/uid').transaction(cur=>(cur||0)+1);
  const newId=uidSnap.snapshot.val();
  const t={id:newId,type,name,cls:type==='player'?selectedClass:null,hp:type==='player'?S.maxHp:null,maxHp:type==='player'?S.maxHp:null,color,size,col,row};
  document.getElementById('iname').value='';
  // Los personajes del master van directo al baúl (fuera de toda escena); col/row quedan como preferencia al sacarlos
  if(type==='player'&&isMaster()){db.ref(ROOT+'/chest/'+newId).set(t).catch(chestError);return;}
  if(type==='player'){
    t.sceneId=activeScene;
    t.owner=me.uid;
    db.ref(ROOT+'/players/'+newId).set(t);
  }else{
    db.ref(ROOT+'/scenes/'+activeScene+'/enemies/'+newId).set(t);
  }
  const newOrder=[...new Set([...getOrdered().map(tk=>tk.id),newId])];
  db.ref(ROOT+'/scenes/'+activeScene+'/order').set(newOrder);
}

// Crea el DOM del token si no existe, y actualiza su posición/visibilidad según viewport.
// Los tokens fuera del viewport se ocultan (display:none) pero NO se eliminan del DOM.
function renderTok(t){drawTok(t);layoutStacks();}
function drawTok(t){
  if(t.type==='player'&&t.sceneId!==activeScene){
    if(t._el)t._el.style.display='none';
    return;
  }
  if(!t._el){
    const el=document.createElement('div');el.id='tok'+t.id;el.className=`token token-${t.type}`;
    el.addEventListener('mousedown',e=>startDrag(e,t.id));
    el.addEventListener('click',e=>{e.stopPropagation();selectTok(t.id);});
    grid.appendChild(el);t._el=el;
  }
  const sc=t.col-S.ox, sr=t.row-S.oy, sz=tokSize(t);
  // Visible si cualquier parte de su cuadrado cae en el viewport (#grid recorta lo que sobresale)
  const inView=sc+sz.n>0&&sc<COLS&&sr+sz.n>0&&sr<ROWS;
  t._el.style.display=inView?'flex':'none';
  if(!inView)return;
  t._el.style.left=sc*CS+'px'; t._el.style.top=sr*CS+'px';
  t._el.style.setProperty('--n',sz.n); t._el.style.setProperty('--b',sz.b);
  t._el.classList.toggle('tok-tiny',sz.b<1); // cuerpo más chico que la casilla (Diminuto, Pequeño): solo el cuerpo recibe el mouse
  t._el.classList.toggle('selected',S.selId===t.id);
  const ip=t.type==='player';
  const iconColor=contrastColor(t.color);
  const bs=ip?`background:${t.color};border-color:${t.color};color:${iconColor};outline:1.5px solid ${iconColor};outline-offset:1px`:'';
  // Fase del latido atada al reloj: al redibujar, la animación sigue donde iba en vez de arrancar de cero
  const ad=`animation-delay:-${Date.now()%1200}ms`;
  t._el.innerHTML=`<div class="tbody" style="${bs?bs+';':''}${ad}">${ip?ICONS[t.cls]||'?':''}</div>`;
}

function renderAllToks(){S.tokens.forEach(drawTok);layoutStacks();renderRemoteArrows();}

// Fichas visibles que comparten celda se abren en abanico (corridas y apenas giradas, como una mano de cartas),
// en orden de iniciativa: la primera queda abajo a la izquierda. Solo visual, las coordenadas no cambian.
function layoutStacks(){
  const cells={};
  S.tokens.forEach(t=>{
    if(!t._el||t._el.style.display==='none')return;
    (cells[t.col+','+t.row]||(cells[t.col+','+t.row]=[])).push(t);
  });
  const ord=id=>{const i=S.order.indexOf(id);return i<0?1e6+id:i;};
  Object.values(cells).forEach(g=>{
    g.sort((a,b)=>ord(a.id)-ord(b.id));
    const n=g.length;
    // Hasta 4 Diminutas solas en una casilla: una por cuadrante, sin abanico
    if(n>1&&n<=4&&g.every(t=>tokSize(t)===SIZES.tiny)){
      g.forEach((t,i)=>{
        t._el.style.transform=`translate(${(i%2?1:-1)*CS/4}px,${(i<2?-1:1)*CS/4}px)`;
        t._el.style.setProperty('--z',10+i);
        t._el.classList.remove('stacked');
      });
      return;
    }
    const step=n>1?Math.min(CS*0.24,CS*0.9/(n-1)):0, ang=n>1?Math.min(8,40/(n-1)):0;
    g.forEach((t,i)=>{
      const k=i-(n-1)/2;
      t._el.style.transform=n>1?`translateX(${k*step}px) rotate(${k*ang}deg)`:'';
      t._el.style.setProperty('--z',10+Math.min(i,9)); // hover (20) y seleccionada (30) siempre quedan arriba
      t._el.classList.toggle('stacked',n>1);
    });
  });
}

// Círculo de turno del panel izquierdo: sobre la ficha activa la deselecciona y no queda ninguna (turn = null)
function toggleTurn(id){
  if(S.turn!==id){selectTok(id);return;}
  S.turn=null; S.selId=null;
  db.ref(ROOT+'/scenes/'+activeScene+'/turn').set(null);
  grid.classList.remove('measuring'); clearArrow();
  renderAllToks(); renderList();
}
function selectTok(id){
  if(S.turn===id)return;
  S.turn=id; S.selId=id;
  db.ref(ROOT+'/scenes/'+activeScene+'/turn').set(id);
  grid.classList.add('measuring');
  renderAllToks(); renderList();
}
function adjHP(id,d){
  const t=S.tokens.find(t=>t.id===id);if(!t||hpHidden(t)||!canEditHp(t))return;
  t.hp=clamp(t.hp+d,0,t.maxHp);
  renderTok(t);renderList();
  db.ref(ROOT+'/players/'+id).update({hp:t.hp});
}
function delTok(id){
  const t=S.tokens.find(t=>t.id===id);if(!t||!canDelete(t))return;
  if(t._el)t._el.remove();
  S.tokens=S.tokens.filter(tk=>tk.id!==id);
  layoutStacks();
  // Si era la activa no se elige otra: queda sin selección
  if(S.turn===id){
    S.turn=null;S.selId=null;
    db.ref(ROOT+'/scenes/'+activeScene+'/turn').set(null);
    grid.classList.remove('measuring');clearArrow();
  }
  if(t.type==='player'){
    db.ref(ROOT+'/players/'+id).remove();
  }else{
    db.ref(ROOT+'/scenes/'+activeScene+'/enemies/'+id).remove();
  }
  const newOrder=S.order.filter(i=>i!==id);
  db.ref(ROOT+'/scenes/'+activeScene+'/order').set(newOrder.length?newOrder:null);
  renderList();
}
function renameTok(id){
  const t=S.tokens.find(t=>t.id===id);if(!t)return;
  const n=prompt('Nuevo nombre:',t.name);if(!n||!n.trim())return;
  t.name=n.trim().slice(0,18);
  renderTok(t);renderList();
  if(t.type==='player'){db.ref(ROOT+'/players/'+id).update({name:t.name});updateDiceNameOptions();}
  else db.ref(ROOT+'/scenes/'+activeScene+'/enemies/'+id).update({name:t.name});
}

/* ── Left panel ── */
let ldragActive=null;
// Devuelve los tokens visibles en la escena activa, ordenados por S.order.
function getOrdered(){
  const visible=S.tokens.filter(t=>t.type==='enemy'||(t.type==='player'&&t.sceneId===activeScene));
  const visIds=visible.map(t=>t.id);
  const ordered=S.order.filter(id=>visIds.includes(id));
  visIds.forEach(id=>{if(!ordered.includes(id))ordered.push(id);});
  return ordered.map(id=>S.tokens.find(t=>t.id===id)).filter(Boolean);
}

// Los jugadores no ven la vida de los personajes del master (sin owner): solo una palabra por % de vida
const hpHidden=t=>!isMaster()&&t.type==='player'&&!t.owner;
function hpWord(t){
  const pct=t.maxHp?t.hp/t.maxHp*100:0;
  const [w,c]=pct>=90?['Entero','#f0c060']:pct>50?['Golpeado','#c8922a']:pct>=20?['Herido','#e2884a']:t.hp>0?['En las últimas','#e24a4a']:['Caído','#8c8c8c'];
  return `<span class="lhp-word" style="color:${c}">${w}</span>`;
}
function renderLeftPanel(){
  const ordered=getOrdered();
  const container=document.getElementById('left-list');
  if(!ordered.length){container.innerHTML=`<div style="padding:8px 0;font-family:'Cinzel',serif;font-size:9px;color:rgba(255,255,255,0.2);text-align:center;letter-spacing:1px">SIN TOKENS</div>`;return;}
  container.innerHTML=ordered.map((t,i)=>{
    const ip=t.type==='player';
    const pct=ip?t.hp/t.maxHp*100:0;
    const hc=pct>50?'#f0c060':pct>25?'#c8922a':'#e24a4a';
    const isTurn=S.turn===t.id;
    return `<div class="litem ${isTurn?'litem-turn':''}" data-id="${t.id}">
      <div class="litem-left">
        <span class="litem-num">${i+1}</span>
        <div class="litem-cb ${isTurn?'on':''}" onmousedown="event.stopPropagation()" onclick="toggleTurn(${t.id})"></div>
      </div>
      <div class="litem-body">
        <div class="litem-header">
          <div class="litem-dot ${ip?'':'enemy'}" style="background:${ip?t.color:'#7a1414'}"></div>
          <span class="litem-name">${t.name}</span>
          ${ip?`<span class="litem-cls">${ICONS[t.cls]||''} ${t.cls||''}</span>`:''}
          ${canDelete(t)?`<button class="tdel" onclick="event.stopPropagation();delTok(${t.id})">✕</button>`:''}
        </div>
        ${ip&&hpHidden(t)?`<div class="lhp-row">${hpWord(t)}</div>`:ip&&!canEditHp(t)?`<div class="lhp-row">
          <span class="lhp-val">${t.hp} / ${t.maxHp}</span>
        </div>
        <div class="lhp-bar-wrap"><div class="lhp-bar" style="width:${pct}%;background:${hc}"></div></div>`:ip?`<div class="lhp-row">
          <button class="lhp-btn" onclick="adjHP(${t.id},-1)">−</button>
          <button class="lhp-btn" onclick="adjHP(${t.id},-5)" style="font-size:8px">-5</button>
          <span class="lhp-val">${t.hp} / ${t.maxHp}</span>
          <button class="lhp-btn" onclick="adjHP(${t.id},5)" style="font-size:8px">+5</button>
          <button class="lhp-btn" onclick="adjHP(${t.id},1)">+</button>
        </div>
        <div class="lhp-bar-wrap"><div class="lhp-bar" style="width:${pct}%;background:${hc}"></div></div>`:''}
      </div>
    </div>`;
  }).join('');
  setupLeftDrag();
}
// Drag & drop de reordenamiento en el panel izquierdo. Excluye botones HP y delete.
function setupLeftDrag(){
  document.querySelectorAll('#left-list .litem').forEach(el=>{
    el.addEventListener('mousedown',e=>{
      if(e.target.closest('.lhp-btn,.tdel'))return;
      ldragActive={id:+el.dataset.id,from:'combat'};
      el.classList.add('dragging-item');
      e.preventDefault();
    });
  });
}

// Alias para compatibilidad interna
function renderList(){renderLeftPanel();}

/* ── Divisor Combatientes / Baúl de personajes ──
   leftSplit = fracción del alto para Combatientes (0.15–0.85), preferencia local en localStorage. */
(()=>{
  const left=document.getElementById('left'), bar=document.getElementById('left-split');
  const combat=document.getElementById('combat-section'), chestSec=document.getElementById('chest-section');
  const apply=r=>{combat.style.flex=`${r} 1 0`;chestSec.style.flex=`${1-r} 1 0`;};
  let r=0.5;
  try{const v=parseFloat(localStorage.getItem('leftSplit'));if(v>=0.15&&v<=0.85)r=v;}catch(e){}
  apply(r);
  let dragging=false;
  bar.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.preventDefault();dragging=true;
    bar.classList.add('dragging');document.body.classList.add('split-dragging');
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const rc=left.getBoundingClientRect(); // incluye el zoom de #app; la proporción no depende de él
    r=clamp((e.clientY-rc.top)/rc.height,0.15,0.85);
    apply(r);
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    bar.classList.remove('dragging');document.body.classList.remove('split-dragging');
    try{localStorage.setItem('leftSplit',String(Math.round(r*1000)/1000));}catch(e){}
  });
})();

/* ── Baúl de personajes (solo master) ──
   sala/chest/{id} guarda fichas fuera de toda escena: nadie las ve en la grilla.
   Sirve para mover enemigos y personajes del master (sin owner) entre escenas. */
let chest=[];
const chestable=t=>isMaster()&&!!t&&(t.type==='enemy'||!t.owner);

function renderChest(){
  const el=document.getElementById('chest-list');if(!el)return;
  if(!chest.length){el.innerHTML=`<div style="padding:8px 0;font-family:'Cinzel',serif;font-size:9px;color:rgba(255,255,255,0.2);text-align:center;letter-spacing:1px">BAÚL VACÍO</div>`;return;}
  el.innerHTML=chest.map(t=>{
    const ip=t.type==='player';
    return `<div class="litem chest-item" data-id="${t.id}">
      <div class="litem-body">
        <div class="litem-header" style="margin-bottom:${ip?3:0}px">
          <div class="litem-dot ${ip?'':'enemy'}" style="background:${ip?t.color:'#7a1414'}"></div>
          <span class="litem-name">${t.name}</span>
          ${ip?`<span class="litem-cls">${ICONS[t.cls]||''} ${t.cls||''}</span>`:''}
          <button class="tdel" onclick="event.stopPropagation();delChest(${t.id})">✕</button>
        </div>
        ${ip?`<div class="chest-hp">HP ${t.hp} / ${t.maxHp}</div>`:''}
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.litem').forEach(it=>it.addEventListener('mousedown',e=>{
    if(e.target.closest('.tdel'))return;
    ldragActive={id:+it.dataset.id,from:'chest'};
    it.classList.add('dragging-item');
    e.preventDefault();
  }));
}
// La escritura es atómica: si Firebase la rechaza (p. ej. reglas sin sala/chest) no se pierde nada
const chestError=err=>alert('No se pudo mover la ficha ('+err.code+'). Revisá que las reglas de Firebase permitan sala/chest.');
function delChest(id){if(isMaster())db.ref(ROOT+'/chest/'+id).remove();}

// Combatientes → Baúl: sale de la escena activa (y de su orden/turno) en una sola escritura
function storeInChest(id){
  const t=S.tokens.find(x=>x.id===id);if(!chestable(t))return;
  const {sceneId,...data}=tokToFb(t);
  const base=ROOT+'/scenes/'+activeScene;
  const upd={[ROOT+'/chest/'+id]:data};
  upd[t.type==='player'?ROOT+'/players/'+id:base+'/enemies/'+id]=null;
  const rest=getOrdered().filter(x=>x.id!==id);
  upd[base+'/order']=rest.length?rest.map(x=>x.id):null;
  if(S.turn===id)upd[base+'/turn']=null; // la activa al baúl: queda sin selección
  db.ref().update(upd).catch(chestError);
}
// Baúl → Combatientes: entra a la escena activa, antes de `beforeId` en el orden (o al final)
function takeFromChest(id,beforeId){
  const c=chest.find(x=>x.id===id);if(!c||!isMaster())return;
  const t={...c,...freeCellInView(c,tokN(c))};
  const base=ROOT+'/scenes/'+activeScene;
  const upd={[ROOT+'/chest/'+id]:null};
  if(t.type==='player'){t.sceneId=activeScene;upd[ROOT+'/players/'+id]=t;}
  else upd[base+'/enemies/'+id]=t;
  const order=getOrdered().map(x=>x.id);
  const bi=beforeId!=null?order.indexOf(beforeId):-1;
  if(bi>=0)order.splice(bi,0,id);else order.push(id);
  upd[base+'/order']=order;
  db.ref().update(upd).catch(chestError);
}
// Zona del panel izquierdo bajo el puntero durante un arrastre de lista
function ldragTarget(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el)return{};
  const zone=el.closest('#combat-section')?'combat':el.closest('#chest-section')&&isMaster()?'chest':null;
  return{zone,item:el.closest('#left-list .litem')};
}
function clearLdragMarks(){
  document.querySelectorAll('.litem').forEach(el=>el.classList.remove('dragging-item','drag-over'));
  document.querySelectorAll('.left-half').forEach(el=>el.classList.remove('drop-zone'));
}

/* ── Drag tokens ── */

// Inicia arrastre de ficha en el mat. Si hay modo pintura activo, lo destilda.
function startDrag(e,id){
  if(e.button!==0)return;
  if(S.activeTerrain)selectTerrain(S.activeTerrain);
  e.preventDefault();e.stopPropagation();
  const t=S.tokens.find(t=>t.id===id);if(!t||!t._el)return;
  if(S.turn!==id){S.turn=id;S.selId=id;db.ref(ROOT+'/scenes/'+activeScene+'/turn').set(id);}
  // dc,dr = casilla de la ficha por la que se la agarró (fichas grandes): se mantiene bajo el cursor al soltar
  const gr=grid.getBoundingClientRect(),z=CS*appZoom,n=tokN(t);
  const dc=clamp(Math.floor((e.clientX-gr.left)/z)-(t.col-S.ox),0,n-1);
  const dr=clamp(Math.floor((e.clientY-gr.top-2*appZoom)/z)-(t.row-S.oy),0,n-1);
  drag={id,dc,dr,fbSet:false,lastFbCol:null,lastFbRow:null};
  myArrowRef().onDisconnect().remove();
  t._el.classList.add('dragging');
  document.body.classList.add('tok-dragging');
  grid.classList.remove('measuring');
  clearArrow();
  renderAllToks(); renderLeftPanel();
}

document.addEventListener('mousemove',e=>{
  if(terrainPainting){paintCell(e);return;}
  if(ldragActive){
    const {zone,item}=ldragTarget(e);
    document.querySelectorAll('.litem').forEach(el=>el.classList.remove('drag-over'));
    document.querySelectorAll('.left-half').forEach(el=>el.classList.remove('drop-zone'));
    const movable=ldragActive.from==='chest'||chestable(S.tokens.find(t=>t.id===ldragActive.id));
    if(zone&&zone!==ldragActive.from&&movable)document.getElementById(zone+'-section').classList.add('drop-zone');
    if(zone==='combat'&&item&&+item.dataset.id!==ldragActive.id)item.classList.add('drag-over');
    return;
  }
  if(!drag)return;
  const t=S.tokens.find(t=>t.id===drag.id);if(!t||!t._el)return;
  const rect=grid.getBoundingClientRect();
  const z=CS*appZoom;
  const hc=Math.floor((e.clientX-rect.left)/z);
  const hr=Math.floor((e.clientY-rect.top-2*appZoom)/z);
  const sc=t.col-S.ox, sr=t.row-S.oy;
  const tc=hc-drag.dc, tr=hr-drag.dr; // esquina destino
  if(hc<0||hc>=COLS||hr<0||hr>=ROWS||tc===sc&&tr===sr){clearArrow();return;}
  arrowTarget={sc:tc,sr:tr};
  arrowLocal.innerHTML=arrowSvg(sc,sr,tc,tr,tokN(t));
  const absCol=tc+S.ox, absRow=tr+S.oy;
  if(!drag.fbSet||drag.lastFbCol!==absCol||drag.lastFbRow!==absRow){
    drag.fbSet=true;drag.lastFbCol=absCol;drag.lastFbRow=absRow;
    myArrowRef().set({fromId:drag.id,toCol:absCol,toRow:absRow});
  }
});

document.addEventListener('mouseup',e=>{
  terrainPainting=false;
  if(ldragActive){
    const {zone,item}=ldragTarget(e);
    const {id,from}=ldragActive;
    const itemId=item?+item.dataset.id:null;
    if(from==='combat'&&zone==='combat'&&item&&itemId!==id){
      const cur=getOrdered().map(t=>t.id);
      const fi=cur.indexOf(id), ti=cur.indexOf(itemId);
      if(fi!==-1&&ti!==-1){cur.splice(fi,1);cur.splice(ti,0,id);}
      S.order=cur;
      db.ref(ROOT+'/scenes/'+activeScene+'/order').set(S.order);
    }else if(from==='combat'&&zone==='chest')storeInChest(id);
    else if(from==='chest'&&zone==='combat')takeFromChest(id,itemId);
    clearLdragMarks();
    ldragActive=null; renderLeftPanel(); renderChest(); return;
  }
  if(!drag)return;
  const t=S.tokens.find(t=>t.id===drag.id);
  if(t&&t._el){
    t._el.classList.remove('dragging');
    document.body.classList.remove('tok-dragging');
    if(arrowTarget){
      t.col=arrowTarget.sc+S.ox; t.row=arrowTarget.sr+S.oy;
      if(t.type==='player')db.ref(ROOT+'/players/'+t.id).update({col:t.col,row:t.row});
      else db.ref(ROOT+'/scenes/'+activeScene+'/enemies/'+t.id).update({col:t.col,row:t.row});
    }
    clearArrow();
    myArrowRef().onDisconnect().cancel();
    if(S.selId)grid.classList.add('measuring');
    renderTok(t);renderList();
  }
  drag=null;
});

/* ── Distance arrow ── */
// Flecha local (arrastre propio) y flechas ajenas van en grupos SVG separados:
// las flechas de otros clientes nunca pisan el destino del arrastre local.
const arrowLocal=document.getElementById('arrow-local');
const arrowsRemote=document.getElementById('arrows-remote');
let arrowTarget=null; // destino del arrastre LOCAL {sc,sr} en coords de pantalla
let remoteArrows={};  // {clientId: {fromId,toCol,toRow}} de la escena activa

// Cada cliente escribe solo su propia flecha → dos arrastres simultáneos no se borran entre sí.
function myArrowRef(){return db.ref(ROOT+'/scenes/'+activeScene+'/arrows/'+CLIENT_ID);}

function clearArrow(){
  arrowLocal.innerHTML='';arrowTarget=null;
  if(drag&&drag.fbSet){drag.fbSet=false;myArrowRef().remove();}
}

function renderRemoteArrows(){
  arrowsRemote.innerHTML=Object.entries(remoteArrows).map(([cid,v])=>{
    if(cid===CLIENT_ID)return '';
    const t=S.tokens.find(t=>t.id===v.fromId);if(!t)return '';
    return arrowSvg(t.col-S.ox,t.row-S.oy,v.toCol-S.ox,v.toRow-S.oy,tokN(t));
  }).join('');
}
// Genera el markup SVG de una flecha desde celda origen a destino (coords de pantalla, no absolutas).
// Distancia D&D 5e: Chebyshev (diagonal = 5 ft, igual que recto).
// n = casillas por lado de la ficha: la flecha va de centro a centro de su cuadrado
function arrowSvg(sc,sr,ec,er,n=1){
  if(sc===ec&&sr===er)return '';
  const half=CS*n/2;
  const x1=sc*CS+half, y1=sr*CS+half;
  const x2=ec*CS+half, y2=er*CS+half;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len, uy=dy/len;
  // shorten end to not overlap center of target cell
  const tip=half*0.76;
  const ex=x2-ux*tip, ey=y2-uy*tip;
  // arrowhead size
  const ah=10, aw=6;
  const px=-uy, py=ux;
  const ax=ex-ux*ah, ay=ey-uy*ah;
  const pts=`${ex},${ey} ${ax+px*aw},${ay+py*aw} ${ax-px*aw},${ay-py*aw}`;
  const steps=Math.max(Math.abs(ec-sc),Math.abs(er-sr));
  const dist=steps*5;
  const lb=Math.max(40,CS*0.9); // recuadro de la etiqueta: con celdas chicas (zoom 3) no baja de 40px para que entre el texto
  return `
    <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="rgba(240,192,96,0.9)" stroke-width="3"/>
    <polygon points="${pts}" fill="rgba(240,192,96,0.95)" filter="url(#glow)"/>
    <rect x="${x2-lb/2}" y="${y2-lb/2}" width="${lb}" height="${lb}" rx="4" fill="rgba(0,0,0,0.7)" stroke="rgba(240,192,96,0.6)" stroke-width="1"/>
    <text x="${x2}" y="${y2-5}" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#f0c060" font-weight="bold">${dist} ft</text>
    <text x="${x2}" y="${y2+7}" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="rgba(200,180,120,0.7)">${steps} sq</text>`;
}

grid.addEventListener('mouseleave',()=>{if(drag)clearArrow();});

grid.addEventListener('dblclick',e=>{
