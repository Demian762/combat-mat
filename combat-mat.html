<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Combat Mat — D&D Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root { --amber:#c8922a; --amber-lt:#f0c060; --amber-dim:rgba(200,146,42,0.2); --cs:44px; --panel:rgba(8,6,4,0.97); --border:rgba(200,146,42,0.22); }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#141414; overflow:hidden; width:100vw; height:100vh; font-family:'EB Garamond',serif; display:flex; align-items:center; justify-content:center; }
#app { display:flex; align-items:stretch; gap:0; box-shadow:0 0 60px rgba(0,0,0,0.8); }
#grid-wrap { position:relative; flex-shrink:0; }
#grid { position:relative; display:grid; box-sizing:content-box; grid-template-columns:repeat(20,var(--cs)); grid-template-rows:repeat(20,var(--cs)); width:calc(20*var(--cs)); height:calc(20*var(--cs)); border:2px solid var(--amber); border-left:none; border-right:none; }
#grid.painting { cursor:crosshair; }
.token { position:absolute; width:var(--cs); height:var(--cs); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; user-select:none; z-index:10; }
.token:hover { filter:brightness(1.35); z-index:20; }
.token.selected { z-index:30; }
.token.dragging { cursor:grabbing; z-index:100; opacity:.85; }
body.tok-dragging, body.tok-dragging * { cursor:none !important; }
.tbody { width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:16px; position:relative; }
.token-player .tbody { border-radius:50%; border:2px solid; }
.token-player.selected .tbody { box-shadow:0 0 0 2px var(--amber-lt),0 0 14px var(--amber); }
.token-enemy .tbody { border-radius:4px; background:rgba(90,8,8,0.88); border:2px solid rgba(180,40,40,0.75); box-shadow:0 0 10px rgba(180,30,30,0.4); }
.token-enemy.selected .tbody { border-color:#ff5555; box-shadow:0 0 14px rgba(255,60,60,0.6); }
.tcell { position:absolute; width:var(--cs); height:var(--cs); z-index:5; pointer-events:none; }

/* Left panel */
#left { width:260px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:2px solid var(--amber); display:flex; flex-direction:column; overflow-y:auto; max-height:calc(20*var(--cs) + 4px); }
#left::-webkit-scrollbar { width:3px; }
#left::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.litem { padding:7px 10px 7px 0; border-bottom:1px solid var(--border); cursor:grab; user-select:none; transition:background .1s; display:flex; align-items:flex-start; gap:0; }
.litem:last-child { border-bottom:none; }
.litem.dragging-item { opacity:.4; }
.litem.drag-over { border-top:2px solid var(--amber-lt); }
.litem.litem-turn { background:rgba(200,146,42,0.07); border-left:2px solid var(--amber); }
.litem-left { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; width:36px; flex-shrink:0; padding-top:2px; border-right:1px solid var(--border); margin-right:8px; }
.litem-num { font-family:'Cinzel',serif; font-size:10px; color:rgba(200,146,42,0.6); line-height:1; padding-left:0; text-align:center; width:100%; }
.litem-cb { width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(200,146,42,0.4); background:rgba(255,255,255,0.04); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; flex-shrink:0; }
.litem-cb:hover { border-color:var(--amber); }
.litem-cb.on { background:var(--amber); border-color:var(--amber-lt); box-shadow:0 0 6px rgba(200,146,42,0.6); }
.litem-body { flex:1; min-width:0; }
.litem-header { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.litem-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.litem-dot.enemy { border-radius:2px; }
.litem-name { font-family:'Cinzel',serif; font-size:10px; color:#e0d0b0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.litem-cls { font-family:'Cinzel',serif; font-size:9px; color:rgba(200,160,80,0.7); flex-shrink:0; }
.lhp-row { display:flex; align-items:center; gap:3px; }
.lhp-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-family:'Cinzel',serif; font-size:10px; width:22px; height:20px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s; }
.lhp-btn:hover { background:rgba(200,146,42,0.2); }
.lhp-val { font-family:'Cinzel',serif; font-size:10px; color:#ddd; flex:1; text-align:center; }
.lhp-bar-wrap { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin-top:4px; }
.lhp-bar { height:100%; border-radius:2px; transition:width .3s,background .3s; }

/* Right panel */
#side { width:220px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-left:2px solid var(--amber); display:flex; flex-direction:column; overflow-y:auto; max-height:calc(20*var(--cs) + 4px); }
#side::-webkit-scrollbar { width:3px; }
#side::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.section { padding:10px 12px; border-bottom:1px solid var(--border); }
.section:last-child { border-bottom:none; }
.sec-title { font-family:'Cinzel',serif; font-size:10px; color:var(--amber-lt); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; display:block; }
#terrain-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.terr-sw { height:28px; border-radius:3px; cursor:pointer; border:2px solid transparent; transition:border-color .12s,transform .1s; }
.terr-sw:hover { border-color:rgba(255,255,255,0.35); transform:scale(1.06); }
.terr-sw.active { border-color:#fff; box-shadow:0 0 6px rgba(255,255,255,0.25); }
.tbtn-erase { height:28px; border-radius:3px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); font-size:12px; display:flex; align-items:center; justify-content:center; transition:border-color .12s; }
.tbtn-erase:hover { border-color:rgba(255,255,255,0.3); }
.tbtn-erase.active { border-color:rgba(200,80,80,0.9); color:#e08080; background:rgba(180,40,40,0.2); }

/* Pan controls */
#pan-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; margin-top:8px; width:90px; margin-left:auto; margin-right:auto; }
.pan-btn { height:28px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); border-radius:4px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:background .12s; }
.pan-btn:hover { background:rgba(200,146,42,0.2); }
.pan-center { display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:8px; color:rgba(255,255,255,0.2); }

input[type=text] { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; padding:4px 7px; border-radius:4px; font-family:'EB Garamond',serif; font-size:13px; margin-bottom:6px; outline:none; }
input[type=text]:focus { border-color:var(--amber); }
#cls-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin-bottom:6px; }
.clsbtn { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:3px; color:rgba(255,255,255,0.55); font-size:13px; padding:4px 0; cursor:pointer; text-align:center; transition:background .12s,border-color .12s; }
.clsbtn:hover { background:rgba(255,255,255,0.09); }
.clsbtn.active { border-color:var(--amber); background:rgba(200,146,42,0.15); color:var(--amber-lt); }
.plabel { font-family:'Cinzel',serif; font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:3px; }
.hpmax-ctrl { display:flex; align-items:center; gap:4px; margin-bottom:6px; }
.hpmax-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:26px; height:28px; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hpmax-btn:hover { background:rgba(200,146,42,0.15); }
.hpmax-val { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#ddd; font-family:'Cinzel',serif; font-size:12px; text-align:center; border-radius:4px; height:28px; line-height:28px; }
.btn { font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; padding:6px; border-radius:4px; border:1px solid; cursor:pointer; text-transform:uppercase; width:100%; margin-bottom:4px; transition:background .15s; }
.bp { background:rgba(70,130,210,0.1); border-color:rgba(70,130,210,0.45); color:#80b4ee; }
.bp:hover { background:rgba(70,130,210,0.25); }
.be { background:rgba(170,35,35,0.1); border-color:rgba(170,35,35,0.45); color:#e07070; }
.be:hover { background:rgba(170,35,35,0.25); }
.bd { background:rgba(100,20,20,0.15); border-color:rgba(160,35,35,0.35); color:#c06060; font-size:8px; padding:4px; }
.bd:hover { background:rgba(160,35,35,0.3); }

.tdel { background:none; border:none; color:rgba(200,80,80,0.6); cursor:pointer; font-size:10px; padding:0 2px; }
.tdel:hover { color:#e07070; }
.ctrow { display:flex; gap:4px; margin-bottom:0; }
.ctbtn { flex:1; display:flex; align-items:center; gap:4px; padding:4px 5px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:border-color .12s; }
.ctbtn:hover { border-color:var(--amber-dim); }
.ctbtn.active { border-color:var(--amber); }
.ctbtn span { font-family:'Cinzel',serif; font-size:7px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:.5px; }
.cprev { width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); flex-shrink:0; }

/* Dice panel */
#dice { width:212px; flex-shrink:0; background:var(--panel); border:2px solid var(--amber); border-right:none; display:flex; flex-direction:column; max-height:calc(20*var(--cs) + 4px); }
#dice::-webkit-scrollbar { width:3px; }
#dice::-webkit-scrollbar-thumb { background:var(--amber-dim); border-radius:2px; }
.dice-row { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.die-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); font-size:13px; width:22px; height:22px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; flex-shrink:0; }
.die-btn:hover { background:rgba(200,146,42,0.2); }
.die-pick-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:3px; color:rgba(255,255,255,0.6); font-family:'Cinzel',serif; font-size:12px; padding:8px 2px; cursor:pointer; text-align:center; transition:background .12s,border-color .12s; }
.die-pick-btn:hover { background:rgba(255,255,255,0.09); }
.die-pick-btn.has-dice { border-color:var(--amber); background:rgba(200,146,42,0.15); color:var(--amber-lt); }
.roll-btn { font-family:'Cinzel',serif; font-size:12px; letter-spacing:1.5px; padding:9px; border-radius:4px; border:1px solid var(--amber); cursor:pointer; text-transform:uppercase; width:100%; background:rgba(200,146,42,0.1); color:var(--amber-lt); transition:background .15s; margin-top:6px; }
.roll-btn:hover { background:rgba(200,146,42,0.25); }
#dlog-section { background:rgba(28,14,3,0.92); border-top:1px solid var(--border); }
#dlog-section::-webkit-scrollbar { width:3px; }
#dlog-section::-webkit-scrollbar-thumb { background:rgba(200,146,42,0.4); border-radius:2px; }
.dlog-entry { padding:6px 0; border-bottom:1px solid rgba(200,146,42,0.15); }
.dlog-entry:last-child { border-bottom:none; }
.dlog-name { font-family:'Cinzel',serif; font-size:11px; color:var(--amber-lt); }
.dlog-total-val { font-family:'Cinzel',serif; font-size:18px; color:var(--amber-lt); }
.dlog-dice-str { font-family:'Cinzel',serif; font-size:10px; color:var(--amber); }
.dlog-detail-str { font-size:11px; color:rgba(180,110,30,0.75); font-family:'EB Garamond',serif; }
.vd-btn { flex:1; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.5px; padding:7px 2px; border-radius:3px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.2); cursor:default; text-transform:uppercase; transition:all .12s; text-align:center; }
#btn-vent:not([disabled]) { border-color:rgba(80,180,80,0.6); background:rgba(30,90,30,0.22); color:#90e090; cursor:pointer; }
#btn-desv:not([disabled]) { border-color:rgba(210,90,70,0.6); background:rgba(110,35,25,0.22); color:#e09078; cursor:pointer; }
.vd-btn:not([disabled]):hover { filter:brightness(1.25); }
#btn-vent.active, #btn-desv.active { border-color:var(--amber-lt); background:rgba(200,146,42,0.18); color:var(--amber-lt); box-shadow:0 0 8px rgba(200,146,42,0.35); }
#dice .sec-title { font-size:12px; }
#dice .plabel { font-size:11px; letter-spacing:.5px; }
#scene-select, #dplayer-name { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--amber-lt); padding:5px 7px; border-radius:4px; font-family:'Cinzel',serif; font-size:11px; margin-bottom:6px; outline:none; cursor:pointer; appearance:none; }
#scene-select:focus, #dplayer-name:focus { border-color:var(--amber); }
#scene-select option, #dplayer-name option { background:#140e04; color:#ddd; }

</style>
</head>
<body>


<div id="app">

  <!-- Dice panel -->
  <div id="dice">
    <div class="section">
      <span class="sec-title">Nombre</span>
      <select id="dplayer-name" style="margin-bottom:0">
        <option value="">Anónimo</option>
        <option value="Master">Master</option>
      </select>
    </div>
    <div class="section">
      <span class="sec-title">Dados</span>
      <div id="dice-rows"></div>
      <div style="display:flex;align-items:center;gap:4px;margin:5px 0 6px">
        <span id="dsel-str" style="font-family:'Cinzel',serif;font-size:11px;color:rgba(200,180,120,0.7);flex:1">—</span>
        <button onclick="clearDice()" style="background:rgba(140,30,30,0.25);border:1px solid rgba(220,80,80,0.6);color:#e08080;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.5px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:background .12s" onmouseover="this.style.background='rgba(180,40,40,0.45)'" onmouseout="this.style.background='rgba(140,30,30,0.25)'">Limpiar</button>
      </div>
      <label class="plabel">Modificador</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:6px">
        <button class="die-btn" onclick="adjMod(-5)" style="font-size:9px;border-radius:3px 0 0 3px">-5</button>
        <button class="die-btn" onclick="adjMod(-1)" style="border-radius:0;border-left:none">−</button>
        <span id="dmod-val" style="font-family:'Cinzel',serif;font-size:13px;color:#ddd;width:28px;height:26px;line-height:26px;text-align:center;border:1px solid var(--border);border-left:none;background:rgba(255,255,255,0.04)">0</span>
        <button class="die-btn" onclick="adjMod(1)" style="border-radius:0;border-left:none">+</button>
        <button class="die-btn" onclick="adjMod(5)" style="font-size:9px;border-radius:0 3px 3px 0;border-left:none">+5</button>
      </div>
      <div style="display:flex;gap:3px;margin-bottom:6px">
        <button id="btn-vent" class="vd-btn" onclick="setAdvMode('vent')" disabled>Ventaja</button>
        <button id="btn-desv" class="vd-btn" onclick="setAdvMode('desv')" disabled>Desventaja</button>
      </div>
      <button class="roll-btn" onclick="rollDice()">⚄ Tirar</button>
    </div>
    <div class="section" style="text-align:center;padding:10px 12px;height:58px;flex-shrink:0">
      <div id="droll-result" style="font-family:'Cinzel',serif;font-size:30px;color:var(--amber-lt);height:38px;line-height:38px;letter-spacing:2px;overflow:hidden"></div>
    </div>
    <div id="dlog-section" class="section" style="flex:1;overflow-y:auto;min-height:80px">
      <span class="sec-title">Historial</span>
      <div id="dlog-list"></div>
    </div>
  </div>

  <!-- Left panel -->
  <div id="left">
    <div class="section" style="flex:1">
      <span class="sec-title">Combatientes</span>
      <div id="left-list"></div>
    </div>
  </div>

  <!-- Grid -->
  <div id="grid-wrap" style="position:relative;flex-shrink:0;">
    <div id="grid"></div>
    <canvas id="dice-canvas" width="880" height="880" style="position:absolute;top:2px;left:2px;pointer-events:none;z-index:40;"></canvas>
    <svg id="arrow-svg" style="position:absolute;top:2px;left:2px;pointer-events:none;z-index:50;" width="880" height="880"><defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
  </div>

  <!-- Right panel -->
  <div id="side">

    <div class="section">
      <span class="sec-title">Escena</span>
      <select id="scene-select" onchange="switchScene(this.value)">
        <option value="escena1">Escena 1</option>
        <option value="escena2">Escena 2</option>
        <option value="escena3">Escena 3</option>
        <option value="escena4">Escena 4</option>
        <option value="escena5">Escena 5</option>
        <option value="escena6">Escena 6</option>
        <option value="escena7">Escena 7</option>
        <option value="escena8">Escena 8</option>
        <option value="escena9">Escena 9</option>
        <option value="escena10">Escena 10</option>
      </select>
      <button class="btn bp" onclick="bringPlayersHere()" style="margin-bottom:0">Traer personajes acá</button>
    </div>

    <div class="section">
      <span class="sec-title">Terreno</span>
      <div id="terrain-grid">
        <div class="tbtn-erase" id="tbtn-eraser" onclick="selectTerrain('eraser')" title="Borrar">✕</div>
        <div class="terr-sw" id="tbtn-wall"  onclick="selectTerrain('wall')"  title="Pared"   style="background:#161412"></div>
        <div class="terr-sw" id="tbtn-stone" onclick="selectTerrain('stone')" title="Piedra"  style="background:#64646e"></div>
        <div class="terr-sw" id="tbtn-door"  onclick="selectTerrain('door')"  title="Puerta"  style="background:#5a300c"></div>
        <div class="terr-sw" id="tbtn-fence" onclick="selectTerrain('fence')" title="Cerca"   style="background:#b48c3c"></div>
        <div class="terr-sw" id="tbtn-tree"  onclick="selectTerrain('tree')"  title="Árbol"   style="background:#10340e"></div>
        <div class="terr-sw" id="tbtn-grass" onclick="selectTerrain('grass')" title="Hierba"  style="background:#3a6e22"></div>
        <div class="terr-sw" id="tbtn-water" onclick="selectTerrain('water')" title="Agua"    style="background:#123aa0"></div>
        <div class="terr-sw" id="tbtn-ice"   onclick="selectTerrain('ice')"   title="Hielo"   style="background:#78c8dc"></div>
        <div class="terr-sw" id="tbtn-fire"  onclick="selectTerrain('fire')"  title="Fuego"   style="background:#be3c08"></div>
        <div class="terr-sw" id="tbtn-lava"  onclick="selectTerrain('lava')"  title="Lava"    style="background:#c81400"></div>
        <div class="terr-sw" id="tbtn-trap"  onclick="selectTerrain('trap')"  title="Trampa"  style="background:#640606"></div>
        <div class="terr-sw" id="tbtn-sand"  onclick="selectTerrain('sand')"  title="Arena"   style="background:#bea564"></div>
        <div class="terr-sw" id="tbtn-snow"  onclick="selectTerrain('snow')"  title="Nieve"   style="background:#eef2f8"></div>
        <div class="terr-sw" id="tbtn-metal" onclick="selectTerrain('metal')" title="Metal"   style="background:#7a8490"></div>
      </div>
      <div id="pan-grid">
        <div></div>
        <div class="pan-btn" onclick="pan(0,-1)">▲</div>
        <div></div>
        <div class="pan-btn" onclick="pan(-1,0)">◀</div>
        <div class="pan-center" id="coord-lbl">0,0</div>
        <div class="pan-btn" onclick="pan(1,0)">▶</div>
        <div></div>
        <div class="pan-btn" onclick="pan(0,1)">▼</div>
        <div></div>
      </div>
    </div>

    <div class="section">
      <span class="sec-title">Nuevo token</span>
      <label class="plabel">Nombre</label>
      <input type="text" id="iname" placeholder="Nombre..." maxlength="18">
      <div style="display:flex;align-items:baseline;gap:5px;margin-bottom:3px">
        <label class="plabel" style="margin-bottom:0">Clase</label>
        <span id="cls-name" style="font-family:'Cinzel',serif;font-size:9px;color:var(--amber-lt);letter-spacing:.5px"></span>
      </div>
      <div id="cls-grid"></div>
      <label class="plabel">HP Máx</label>
      <div class="hpmax-ctrl">

<script>
// ── Firebase ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyDEYQFhozdmZklBT1K_BHelZZxDjJLFSyU",
  authDomain:        "combat-mat.firebaseapp.com",
  projectId:         "combat-mat",
  storageBucket:     "combat-mat.firebasestorage.app",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const CLIENT_ID = Math.random().toString(36).slice(2);

// ─────────────────────────────────────────────────────────
const PAGE_LOAD_TS = Date.now();
// ─────────────────────────────────────────────────────────

// Iconos por clase para mostrar en fichas y panel izquierdo
const ICONS={'Bárbaro':'⚔','Bardo':'♪','Clérigo':'†','Druida':'✿','Guerrero':'⛊','Monje':'○','Paladín':'✦','Pícaro':'◈','Hechicero':'⬡','Brujo':'◉','Mago':'✧','Explorador':'◎','Artífice':'⚙','Otras':'?'};
const CLASS_LIST=['Bárbaro','Bardo','Clérigo','Druida','Guerrero','Monje','Paladín','Pícaro','Hechicero','Brujo','Mago','Explorador','Artífice','Otras'];
const TERRAIN={
  wall:{bg:'rgba(22,20,18,0.92)'},stone:{bg:'rgba(100,100,110,0.82)'},door:{bg:'rgba(90,48,12,0.88)'},
  fence:{bg:'rgba(180,140,60,0.78)'},tree:{bg:'rgba(16,52,14,0.90)'},grass:{bg:'rgba(58,110,34,0.72)'},
  water:{bg:'rgba(18,58,160,0.78)'},ice:{bg:'rgba(120,200,220,0.72)'},
  fire:{bg:'rgba(190,60,8,0.82)'},lava:{bg:'rgba(200,20,0,0.88)'},trap:{bg:'rgba(100,6,6,0.86)'},sand:{bg:'rgba(190,165,100,0.72)'},
  snow:{bg:'rgba(230,238,248,0.88)'},metal:{bg:'rgba(100,112,126,0.88)'},
};
// Viewport fijo 20x20 celdas. Para cambiar tamaño, modificar COLS/ROWS y el CSS --cs
const COLS=20, ROWS=20;
// Dimensiones naturales de #app (usadas para escalar al tamaño de ventana)
const APP_W=1572, APP_H=884;
let appZoom=1;
// Estado HSV de cada picker de color. 'player' = color activo para nuevos jugadores
const pickerStates={player:{h:211,s:0.59,v:0.89},bg:{h:20,s:0.55,v:0.04},line:{h:35,s:0.65,v:0.72}};
let pickerTarget=null, cpH=211, cpS=0.59, cpV=0.89;
let selectedClass='Bárbaro';
// Estado global. ox/oy = offset del viewport en el mapa infinito.
// terrain = {"col,row": tipo}. order = array de ids para orden del panel izquierdo.
let S={tokens:[],terrain:{},ox:0,oy:0,selId:null,maxHp:20,activeTerrain:null,selectedColor:'#4a90e2',order:[],turn:null};
// drag = estado de arrastre de ficha en el mat. terrainPainting = pincel activo.
let drag=null, terrainPainting=false, uid=0;
const grid=document.getElementById('grid');
const CS=44; // tamaño de celda en px, debe coincidir con --cs en CSS

/* ── Class grid ── */
function initClassGrid(){
  document.getElementById('cls-grid').innerHTML=CLASS_LIST.map(c=>
    `<div class="clsbtn ${c===selectedClass?'active':''}" title="${c}" onclick="pickClass('${c}')">${ICONS[c]}</div>`
  ).join('');
  document.getElementById('cls-name').textContent=selectedClass;
}
function pickClass(c){selectedClass=c;initClassGrid();}

/* ── Color utils ── */
function hsvToRgb(h,s,v){const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60),p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function hsvToHex(h,s,v){return rgbToHex(...hsvToRgb(h,s,v));}

/* ── Color picker ── */
let pickerWriteTimer=null;
function drawPicker(){
  const sq=document.getElementById('cpick-sq'),hc=document.getElementById('cpick-hue');
  if(!sq||!hc)return;
  const W=sq.width,H=sq.height,ctx=sq.getContext('2d');
  const[r,g,b]=hsvToRgb(cpH,1,1);
  ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(0,0,W,H);
  const wg=ctx.createLinearGradient(0,0,W,0);wg.addColorStop(0,'rgba(255,255,255,1)');wg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const cx=cpS*W,cy=(1-cpV)*H;
  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.stroke();
  const hctx=hc.getContext('2d'),hg=hctx.createLinearGradient(0,0,hc.width,0);
  for(let i=0;i<=360;i+=30)hg.addColorStop(i/360,`hsl(${i},100%,50%)`);
  hctx.fillStyle=hg;hctx.fillRect(0,0,hc.width,hc.height);
  const hx=cpH/360*hc.width;
  hctx.beginPath();hctx.arc(hx,hc.height/2,5,0,Math.PI*2);hctx.strokeStyle='#fff';hctx.lineWidth=2;hctx.stroke();
  if(!pickerTarget)return;
  pickerStates[pickerTarget]={h:cpH,s:cpS,v:cpV};
  const hex=hsvToHex(cpH,cpS,cpV);
  document.getElementById('cprev-'+pickerTarget).style.background=hex;
  if(pickerTarget==='player')S.selectedColor=hex;
  else applyGridColors();
  clearTimeout(pickerWriteTimer);
  pickerWriteTimer=setTimeout(()=>{
    if(pickerTarget==='player')db.ref('sala/pickerPlayer').set({h:cpH,s:cpS,v:cpV});
    else db.ref('sala/scenes/'+activeScene+'/pickerStates/'+pickerTarget).set({h:cpH,s:cpS,v:cpV});
  },200);
}
function openPicker(target){
  pickerTarget=target;
  const ps=pickerStates[target];cpH=ps.h;cpS=ps.s;cpV=ps.v;
  document.querySelectorAll('.ctbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ctbtn-'+target).classList.add('active');
  drawPicker();
}
function setupPicker(){
  const sq=document.getElementById('cpick-sq'),hc=document.getElementById('cpick-hue');
  let sqD=false,hD=false;
  function onSq(e){const r=sq.getBoundingClientRect();cpS=Math.max(0,Math.min(1,(e.clientX-r.left)/sq.width));cpV=Math.max(0,Math.min(1,1-(e.clientY-r.top)/sq.height));drawPicker();}
  function onH(e){const r=hc.getBoundingClientRect();cpH=Math.max(0,Math.min(359,(e.clientX-r.left)/hc.width*360));drawPicker();}
  sq.addEventListener('mousedown',e=>{sqD=true;onSq(e);e.stopPropagation();});
  hc.addEventListener('mousedown',e=>{hD=true;onH(e);e.stopPropagation();});
  document.addEventListener('mousemove',e=>{if(sqD)onSq(e);if(hD)onH(e);});
  document.addEventListener('mouseup',()=>{sqD=false;hD=false;});
  Object.keys(pickerStates).forEach(k=>{document.getElementById('cprev-'+k).style.background=hsvToHex(pickerStates[k].h,pickerStates[k].s,pickerStates[k].v);});
  S.selectedColor=hsvToHex(pickerStates.player.h,pickerStates.player.s,pickerStates.player.v);
  applyGridColors();
  openPicker('player');
}
function applyGridColors(){
  const{h:bh,s:bs,v:bv}=pickerStates.bg,{h:lh,s:ls,v:lv}=pickerStates.line;
  const bgHex=hsvToHex(bh,bs,bv);const[lr,lg,lb]=hsvToRgb(lh,ls,lv);
  const lc=`rgba(${lr},${lg},${lb},0.55)`,cs=CS+'px';
  grid.style.background=`repeating-linear-gradient(0deg,${lc} 0,${lc} 1px,transparent 1px,transparent ${cs}),repeating-linear-gradient(90deg,${lc} 0,${lc} 1px,transparent 1px,transparent ${cs}),${bgHex}`;
}

/* ── Pan ── */
function pan(dx,dy){
  S.ox+=dx; S.oy+=dy;
  document.getElementById('coord-lbl').textContent=`${S.ox},${S.oy}`;
  clearArrow();
  renderTerrain(); renderAllToks();
}

/* ── Terrain ── */
function selectTerrain(type){
  S.activeTerrain=S.activeTerrain===type?null:type;
  document.querySelectorAll('.tbtn-erase,.terr-sw').forEach(el=>el.classList.remove('active'));
  if(S.activeTerrain)document.getElementById('tbtn-'+S.activeTerrain)?.classList.add('active');
  grid.classList.toggle('painting',!!S.activeTerrain);
}
// Convierte coordenadas de mouse a celda absoluta (col+ox, row+oy) y pinta/borra terreno
function paintCell(e){
  const rect=grid.getBoundingClientRect();
  const z=CS*appZoom;
  const sc=Math.floor((e.clientX-rect.left)/z);
  const sr=Math.floor((e.clientY-rect.top-2*appZoom)/z);
  if(sc<0||sc>=COLS||sr<0||sr>=ROWS)return;
  const col=sc+S.ox, row=sr+S.oy;
  const key=`${col},${row}`;
  if(S.activeTerrain==='eraser'){
    delete S.terrain[key];
    db.ref('sala/scenes/'+activeScene+'/terrain/'+key).remove();
  }else{
    S.terrain[key]=S.activeTerrain;
    db.ref('sala/scenes/'+activeScene+'/terrain/'+key).set(S.activeTerrain);
  }
  renderTerrain();
}
// Solo renderiza las celdas visibles en el viewport actual (ox..ox+COLS, oy..oy+ROWS)
function renderTerrain(){
  document.querySelectorAll('.tcell').forEach(el=>el.remove());
  Object.entries(S.terrain).forEach(([key,type])=>{
    const t=TERRAIN[type];if(!t)return;
    const[ac,ar]=key.split(',').map(Number);
    const sc=ac-S.ox, sr=ar-S.oy;
    if(sc<0||sc>=COLS||sr<0||sr>=ROWS)return;
    const el=document.createElement('div');el.className='tcell';
    el.style.cssText=`left:${sc*CS}px;top:${sr*CS}px;background:${t.bg}`;
    grid.appendChild(el);
  });
}
function clearTerrain(){
  S.terrain={};
  db.ref('sala/scenes/'+activeScene+'/terrain').remove();
  renderTerrain();
}

grid.addEventListener('mousedown',e=>{if(!S.activeTerrain||e.target.closest('.token'))return;terrainPainting=true;paintCell(e);e.stopPropagation();});

/* ── Grid init ── */
function initGrid(){
  grid.innerHTML=''; applyGridColors();
  S.tokens.forEach(t=>{t._el=null;renderTok(t);});
  renderTerrain(); renderList();
  document.getElementById('coord-lbl').textContent=`${S.ox},${S.oy}`;
}
// Retorna '#000' o '#fff' según luminosidad percibida (WCAG) del color hex
function contrastColor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)>140?'#000':'#fff';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ── Tokens ── */
function adjMaxHp(d){
  S.maxHp=Math.max(1,Math.min(999,S.maxHp+d));
  document.getElementById('ihp-val').textContent=S.maxHp;
  db.ref('sala/maxHp').set(S.maxHp);
}

function tokToFb(t){const{_el,...r}=t;return r;}

function uniqueName(base){
  const names=new Set(S.tokens.map(t=>t.name.toLowerCase()));
  if(!names.has(base.toLowerCase()))return base;
  let n=2;while(names.has(`${base} ${n}`.toLowerCase()))n++;
  return `${base} ${n}`;
}
async function addTok(type){
  const input=document.getElementById('iname').value.trim();
  const base=input?input.slice(0,18):type==='enemy'?'Enemigo':'Jugador';
  const name=uniqueName(base);
  const color=type==='player'?S.selectedColor:'#7a1414';
  let col=S.ox,row=S.oy;
  outer:for(let r=S.oy;r<S.oy+ROWS;r++)for(let c=S.ox;c<S.ox+COLS;c++){
    if(!S.tokens.find(t=>t.col===c&&t.row===r)){col=c;row=r;break outer;}
  }
  const uidSnap=await db.ref('sala/uid').transaction(cur=>(cur||0)+1);
  const newId=uidSnap.snapshot.val();
  const t={id:newId,type,name,cls:type==='player'?selectedClass:null,hp:type==='player'?S.maxHp:null,maxHp:type==='player'?S.maxHp:null,color,col,row};
  if(type==='player'){
    t.sceneId=activeScene;
    db.ref('sala/players/'+newId).set(t);
  }else{
    db.ref('sala/scenes/'+activeScene+'/enemies/'+newId).set(t);
  }
  document.getElementById('iname').value='';
  const newOrder=[...new Set([...getOrdered().map(tk=>tk.id),newId])];
  db.ref('sala/scenes/'+activeScene+'/order').set(newOrder);
  if(!S.turn)db.ref('sala/scenes/'+activeScene+'/turn').set(newId);
}

// Crea el DOM del token si no existe, y actualiza su posición/visibilidad según viewport.
// Los tokens fuera del viewport se ocultan (display:none) pero NO se eliminan del DOM.
function renderTok(t){
  if(t.type==='player'&&t.sceneId!==activeScene){
    if(t._el)t._el.style.display='none';
    return;
  }
  if(!t._el){
    const el=document.createElement('div');el.id='tok'+t.id;el.className=`token token-${t.type}`;
    el.addEventListener('mousedown',e=>startDrag(e,t.id));
    el.addEventListener('click',e=>{e.stopPropagation();selectTok(t.id);});
    grid.appendChild(el);t._el=el;
  }
  const sc=t.col-S.ox, sr=t.row-S.oy;
  const inView=sc>=0&&sc<COLS&&sr>=0&&sr<ROWS;
  t._el.style.display=inView?'flex':'none';
  if(!inView)return;
  t._el.style.left=sc*CS+'px'; t._el.style.top=sr*CS+'px';
  t._el.classList.toggle('selected',S.selId===t.id);
  const ip=t.type==='player';
  const iconColor=contrastColor(t.color);
  const bs=ip?`background:${t.color};border-color:${t.color};color:${iconColor};outline:1.5px solid ${iconColor};outline-offset:1px`:'';
  t._el.innerHTML=`<div class="tbody" style="${bs}">${ip?ICONS[t.cls]||'?':''}</div>`;
}

function renderAllToks(){S.tokens.forEach(renderTok);}

function selectTok(id){
  if(S.turn===id)return;
  S.turn=id; S.selId=id;
  db.ref('sala/scenes/'+activeScene+'/turn').set(id);
  grid.classList.add('measuring');
  renderAllToks(); renderList();
}
function adjHP(id,d){
  const t=S.tokens.find(t=>t.id===id);if(!t)return;
  t.hp=clamp(t.hp+d,0,t.maxHp);
  renderTok(t);renderList();
  db.ref('sala/players/'+id).update({hp:t.hp});
}
function delTok(id){
  const t=S.tokens.find(t=>t.id===id);if(!t)return;
  if(t._el)t._el.remove();
  S.tokens=S.tokens.filter(tk=>tk.id!==id);
  if(S.turn===id){
    const next=getOrdered()[0]||null;
    db.ref('sala/scenes/'+activeScene+'/turn').set(next?next.id:null);
    if(!next){S.selId=null;grid.classList.remove('measuring');clearArrow();}
  }
  if(t.type==='player'){
    db.ref('sala/players/'+id).remove();
  }else{
    db.ref('sala/scenes/'+activeScene+'/enemies/'+id).remove();
  }
  const newOrder=S.order.filter(i=>i!==id);
  db.ref('sala/scenes/'+activeScene+'/order').set(newOrder.length?newOrder:null);
  renderList();
}
function renameTok(id){
  const t=S.tokens.find(t=>t.id===id);if(!t)return;
  const n=prompt('Nuevo nombre:',t.name);if(!n||!n.trim())return;
  t.name=n.trim().slice(0,18);
  renderTok(t);renderList();
  if(t.type==='player'){db.ref('sala/players/'+id).update({name:t.name});updateDiceNameOptions();}
  else db.ref('sala/scenes/'+activeScene+'/enemies/'+id).update({name:t.name});
}
function clearAll(){
  S.tokens.forEach(t=>{if(t._el)t._el.remove();});
  S.tokens=[];S.selId=null;S.order=[];S.turn=null;
  grid.classList.remove('measuring');clearArrow();
  db.ref('sala/players').remove();
  db.ref('sala/scenes/'+activeScene+'/enemies').remove();
  db.ref('sala/scenes/'+activeScene+'/order').remove();
  db.ref('sala/scenes/'+activeScene+'/turn').set(null);
  clearTerrain();renderList();
}

/* ── Left panel ── */
let ldragActive=null;
// Devuelve los tokens visibles en la escena activa, ordenados por S.order.
function getOrdered(){
  const visible=S.tokens.filter(t=>t.type==='enemy'||(t.type==='player'&&t.sceneId===activeScene));
  const visIds=visible.map(t=>t.id);
  const ordered=S.order.filter(id=>visIds.includes(id));
  visIds.forEach(id=>{if(!ordered.includes(id))ordered.push(id);});
  return ordered.map(id=>S.tokens.find(t=>t.id===id)).filter(Boolean);
}

function renderLeftPanel(){
  const ordered=getOrdered();
  const container=document.getElementById('left-list');
  if(!ordered.length){container.innerHTML=`<div style="padding:8px 0;font-family:'Cinzel',serif;font-size:9px;color:rgba(255,255,255,0.2);text-align:center;letter-spacing:1px">SIN TOKENS</div>`;return;}
  container.innerHTML=ordered.map((t,i)=>{
    const ip=t.type==='player';
    const pct=ip?t.hp/t.maxHp*100:0;
    const hc=pct>50?'#f0c060':pct>25?'#c8922a':'#e24a4a';
    const isTurn=S.turn===t.id;
    return `<div class="litem ${isTurn?'litem-turn':''}" data-id="${t.id}">
      <div class="litem-left">
        <span class="litem-num">${i+1}</span>
        <div class="litem-cb ${isTurn?'on':''}" onmousedown="event.stopPropagation()" onclick="selectTok(${t.id})"></div>
      </div>
      <div class="litem-body">
        <div class="litem-header">
          <div class="litem-dot ${ip?'':'enemy'}" style="background:${ip?t.color:'#7a1414'}"></div>
          <span class="litem-name">${t.name}</span>
          ${ip?`<span class="litem-cls">${ICONS[t.cls]||''} ${t.cls||''}</span>`:''}
          <button class="tdel" onclick="event.stopPropagation();delTok(${t.id})">✕</button>
        </div>
        ${ip?`<div class="lhp-row">
          <button class="lhp-btn" onclick="adjHP(${t.id},-1)">−</button>
          <button class="lhp-btn" onclick="adjHP(${t.id},-5)" style="font-size:8px">-5</button>
          <span class="lhp-val">${t.hp} / ${t.maxHp}</span>
          <button class="lhp-btn" onclick="adjHP(${t.id},5)" style="font-size:8px">+5</button>
          <button class="lhp-btn" onclick="adjHP(${t.id},1)">+</button>
        </div>
        <div class="lhp-bar-wrap"><div class="lhp-bar" style="width:${pct}%;background:${hc}"></div></div>`:''}
      </div>
    </div>`;
  }).join('');
  setupLeftDrag();
}
// Drag & drop de reordenamiento en el panel izquierdo. Excluye botones HP y delete.
function setupLeftDrag(){
  document.querySelectorAll('#left-list .litem').forEach(el=>{
    el.addEventListener('mousedown',e=>{
      if(e.target.closest('.lhp-btn,.tdel'))return;
      ldragActive={id:+el.dataset.id};
      el.classList.add('dragging-item');
      e.preventDefault();
    });
  });
}

// Alias para compatibilidad interna
function renderList(){renderLeftPanel();}

/* ── Drag tokens ── */

// Inicia arrastre de ficha en el mat. Bloquea si hay modo pintura activo.
function startDrag(e,id){
  if(e.button!==0||S.activeTerrain)return;e.preventDefault();e.stopPropagation();
  const t=S.tokens.find(t=>t.id===id);if(!t||!t._el)return;
  if(S.turn!==id){S.turn=id;S.selId=id;db.ref('sala/scenes/'+activeScene+'/turn').set(id);}
  drag={id,fbSet:false,lastFbCol:null,lastFbRow:null};
  db.ref('sala/scenes/'+activeScene+'/arrow').onDisconnect().remove();
  t._el.classList.add('dragging');
  document.body.classList.add('tok-dragging');
  grid.classList.remove('measuring');
  clearArrow();
  renderAllToks(); renderLeftPanel();

/* ── Distance arrow ── */
const svg=document.getElementById('arrow-svg');
let arrowTarget=null; // celda destino activa {sc,sr} en coords de pantalla

function clearArrow(){
  const defs=svg.querySelector('defs');svg.innerHTML='';if(defs)svg.appendChild(defs);arrowTarget=null;
  if(drag&&drag.fbSet){drag.fbSet=false;db.ref('sala/scenes/'+activeScene+'/arrow').set(null);}
}
// Dibuja flecha SVG desde celda origen a destino (coords de pantalla, no absolutas).
// Distancia D&D 5e: Chebyshev (diagonal = 5 ft, igual que recto).
function drawArrow(sc,sr,ec,er){
  if(sc===ec&&sr===er)return;
  const half=CS/2;
  const x1=sc*CS+half, y1=sr*CS+half;
  const x2=ec*CS+half, y2=er*CS+half;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len, uy=dy/len;
  // shorten end to not overlap center of target cell
  const tip=CS*0.38;
  const ex=x2-ux*tip, ey=y2-uy*tip;
  // arrowhead size
  const ah=10, aw=6;
  const px=-uy, py=ux;
  const ax=ex-ux*ah, ay=ey-uy*ah;
  const pts=`${ex},${ey} ${ax+px*aw},${ay+py*aw} ${ax-px*aw},${ay-py*aw}`;
  const steps=Math.max(Math.abs(ec-sc),Math.abs(er-sr));
  const dist=steps*5;
  // Preservar el <defs> estático del SVG al limpiar
  const defs=svg.querySelector('defs');
  svg.innerHTML='';
  if(defs)svg.appendChild(defs);
  svg.innerHTML+=`
    <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="rgba(240,192,96,0.9)" stroke-width="3"/>
    <polygon points="${pts}" fill="rgba(240,192,96,0.95)" filter="url(#glow)"/>
    <rect x="${x2-half*0.9}" y="${y2-half*0.9}" width="${CS*0.9}" height="${CS*0.9}" rx="4" fill="rgba(0,0,0,0.7)" stroke="rgba(240,192,96,0.6)" stroke-width="1"/>
    <text x="${x2}" y="${y2-5}" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#f0c060" font-weight="bold">${dist} ft</text>
    <text x="${x2}" y="${y2+7}" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="rgba(200,180,120,0.7)">${steps} sq</text>`;
}

const DSIDES={d4:4,d6:6,d8:8,d10:10,d12:12,d20:20};
const DCOLORS={d4:0xe8a020,d6:0x4682d4,d8:0x9b4de0,d10:0x20a8b8,d12:0xc44040,d20:0x20a060};
let dCount={d4:0,d6:0,d8:0,d10:0,d12:0,d20:0},dMod=0,dAdvMode=null,dLog=[],dMeshes=[];
let dScene,dCamera,dRenderer;

const DCAM_DIR=new THREE.Vector3(0,18,14).normalize();

function makeNumTex(num,baseColor){
  const c=document.createElement('canvas');c.width=c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#'+baseColor.toString(16).padStart(6,'0');ctx.fillRect(0,0,256,256);
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=7;ctx.strokeRect(14,14,228,228);
  const fontSize=num>=10?62:76;
  ctx.font=`bold ${fontSize}px "Georgia",serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineWidth=8;
  ctx.strokeText(String(num),128,128);
  ctx.fillStyle='#fff';
  ctx.fillText(String(num),128,128);
  return new THREE.CanvasTexture(c);
}

function setupFaceGroups(geom,numFaces,triPerFace){
  geom.clearGroups();
  const pos=geom.attributes.position;
  const uvArr=new Float32Array(pos.count*2);
  const normals=[];
  for(let i=0;i<numFaces;i++){
    const vStart=i*triPerFace*3,count=triPerFace*3;
    geom.addGroup(vStart,count,i);
    // Face normal from centroid
    let cx=0,cy=0,cz=0;
    for(let j=vStart;j<vStart+count;j++){cx+=pos.getX(j);cy+=pos.getY(j);cz+=pos.getZ(j);}
    const fn=new THREE.Vector3(cx/count,cy/count,cz/count).normalize();
    normals.push(fn);
    // Local 2D frame on face plane
    const up=Math.abs(fn.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(0,0,1);
    const tU=new THREE.Vector3().crossVectors(up,fn).normalize();
    const tV=new THREE.Vector3().crossVectors(fn,tU).normalize();
    // Project verts onto face plane
    const pts=[];
    let minU=1e9,maxU=-1e9,minV=1e9,maxV=-1e9;
    for(let j=vStart;j<vStart+count;j++){
      const v=new THREE.Vector3(pos.getX(j),pos.getY(j),pos.getZ(j));
      const u=v.dot(tU),vv=v.dot(tV);
      pts.push([u,vv]);
      if(u<minU)minU=u;if(u>maxU)maxU=u;if(vv<minV)minV=vv;if(vv>maxV)maxV=vv;
    }
    // Uniform scale centered at vertex centroid (not bbox midpoint)
    const range=Math.max(maxU-minU,maxV-minV)||1;
    const scale=0.72/range;
    let cu=0,cv=0;pts.forEach(p=>{cu+=p[0];cv+=p[1];});cu/=pts.length;cv/=pts.length;
    for(let k=0;k<pts.length;k++){
      const j=vStart+k;
      uvArr[j*2]  =0.5+(pts[k][0]-cu)*scale;
      uvArr[j*2+1]=0.5+(pts[k][1]-cv)*scale;
    }
  }
  geom.setAttribute('uv',new THREE.BufferAttribute(uvArr,2));
  return normals;
}

function initDiceScene(){
  if(!window.THREE)return;
  const canvas=document.getElementById('dice-canvas');
  dScene=new THREE.Scene();
  dCamera=new THREE.PerspectiveCamera(50,1,0.1,200);
  dCamera.position.set(0,18,14);dCamera.lookAt(0,0,0);
  dRenderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  dRenderer.setSize(880,880);
  dRenderer.setClearColor(0x000000,0);
  dScene.add(new THREE.AmbientLight(0xffffff,0.6));
  const dl=new THREE.DirectionalLight(0xfff4cc,1.2);dl.position.set(5,10,8);dScene.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,0.3);dl2.position.set(-5,5,-5);dScene.add(dl2);
  (function loop(){
    requestAnimationFrame(loop);
    let anyDead=false;
    dMeshes.forEach(m=>{
      // Physics
      m.pvy-=0.06;m.py+=m.pvy;
      if(m.py<=m.floorY){m.py=m.floorY;m.pvy=-m.pvy*.35;if(Math.abs(m.pvy)<0.08)m.pvy=0;}
      m.mesh.position.y=m.py;
      // Rotation / snap
      if(m.pvy!==0){
        m.mesh.rotation.x+=m.rx;m.mesh.rotation.y+=m.ry;m.mesh.rotation.z+=m.rz;
        m.rx*=.97;m.ry*=.97;m.rz*=.97;
      } else if(m.mesh._faceNormals&&!m.snapDone){
        if(m.targetQ===null){
          m.rx=0;m.ry=0;m.rz=0;
          const fn=m.mesh._faceNormals[0].clone().applyQuaternion(m.mesh.quaternion);
          const rot=new THREE.Quaternion().setFromUnitVectors(fn,DCAM_DIR);
          m.targetQ=new THREE.Quaternion().multiplyQuaternions(rot,m.mesh.quaternion);
        }
        m.mesh.quaternion.slerp(m.targetQ,0.05);
        if(m.mesh.quaternion.angleTo(m.targetQ)<0.01)m.snapDone=true;
      }
      // Per-die fade: 10s visible, then 0.75s fade out
      m.age++;
      if(m.age>600){
        if(!m.fading){
          m.fading=true;
          m.mesh.traverse(c=>{if(c.isMesh)[].concat(c.material).forEach(mat=>{mat.transparent=true;mat.needsUpdate=true;});});
        }
        m.fadeAlpha=Math.max(0,1-(m.age-600)/45);
        m.mesh.traverse(c=>{if(c.isMesh)[].concat(c.material).forEach(mat=>mat.opacity=m.fadeAlpha);});
        if(m.fadeAlpha<=0){dScene.remove(m.mesh);m.dead=true;anyDead=true;}
      }
    });
    if(anyDead)dMeshes=dMeshes.filter(m=>!m.dead);
    dRenderer.render(dScene,dCamera);
  })();
}

function dMakeMesh(dt,result,dieColor){
  result=result||1;
  const s=1.3;
  const col=dieColor!=null?dieColor:DCOLORS[dt];
  if(dt==='d10'){
    const mat=new THREE.MeshPhongMaterial({color:col,shininess:100,specular:0x333333});
    const g=new THREE.Group();
    const top=new THREE.Mesh(new THREE.ConeGeometry(0.9,1.2,5),mat);top.position.y=0.6;
    const bot=new THREE.Mesh(new THREE.ConeGeometry(0.9,0.9,5),mat);bot.rotation.x=Math.PI;bot.position.y=-0.45;
    g.add(top);g.add(bot);g._faceNormals=null;
    return g;
  }
  const sides=DSIDES[dt];
  const others=[];for(let n=1;n<=sides;n++)if(n!==result)others.push(n);
  for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  const nums=[result,...others];
  let geom,faceNormals;
  if(dt==='d6'){
    geom=new THREE.BoxGeometry(s,s,s);
    faceNormals=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),new THREE.Vector3(0,1,0),new THREE.Vector3(0,-1,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)];
  } else {
    const cfg={d4:[4,1],d8:[8,1],d12:[12,3],d20:[20,1]};
    const[nf,tpf]=cfg[dt];
    const gmap={d4:new THREE.TetrahedronGeometry(s),d8:new THREE.OctahedronGeometry(s),d12:new THREE.DodecahedronGeometry(s),d20:new THREE.IcosahedronGeometry(s)};
    geom=gmap[dt];
    faceNormals=setupFaceGroups(geom,nf,tpf);
  }
  const mats=nums.map(n=>new THREE.MeshLambertMaterial({map:makeNumTex(n,col)}));
  const mesh=new THREE.Mesh(geom,mats);
  mesh._faceNormals=faceNormals;
  return mesh;
}

function dFindPos(occupied){
  const minD2=3.2*3.2;
  for(let i=0;i<80;i++){
    const x=(Math.random()-.5)*12;
    const z=(Math.random()-.5)*7;
    if(occupied.every(p=>(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z)>=minD2))return{x,z};
  }
  return{x:(Math.random()-.5)*12,z:(Math.random()-.5)*7};
}

function spawnDiceMeshes(rolls, meshList, dieColor){
  if(!dScene)return;
  const rollsCopy={};Object.keys(rolls).forEach(dt=>{rollsCopy[dt]=[...rolls[dt]];});
  const resultList=meshList.map(dt=>{const a=rollsCopy[dt]||(rollsCopy[dt]=[]);return a.length?a.shift():1;});
  const placed=[];
  meshList.forEach((dt,i)=>{
    const mesh=dMakeMesh(dt,resultList[i],dieColor??null);
    const pos=dFindPos([...dMeshes.map(m=>({x:m.mesh.position.x,z:m.mesh.position.z})),...placed]);
    placed.push(pos);
    const startX=pos.x+(Math.random()-.5)*16;
    const startZ=pos.z+(Math.random()-.5)*10;
    const startY=10+Math.random()*5;
    mesh.position.set(startX,startY,startZ);
    dScene.add(mesh);
    dMeshes.push({mesh,rx:(Math.random()-.5)*.5,ry:(Math.random()-.5)*.5,rz:(Math.random()-.5)*.3,py:startY,pvy:-0.05,floorY:1.1,targetQ:null,snapDone:false,age:0,fading:false,fadeAlpha:1,dead:false});
  });
}

function rollDice(){
  if(!Object.values(dCount).some(n=>n>0))return;
  let rolls={},sum=dMod,diceStr,meshList;
  const modStr=dMod>0?`+${dMod}`:dMod<0?String(dMod):'';
  const only1d20=dCount.d20===1&&dCount.d4===0&&dCount.d6===0&&dCount.d8===0&&dCount.d10===0&&dCount.d12===0;
  if(dAdvMode&&only1d20){
    const r1=Math.floor(Math.random()*20)+1,r2=Math.floor(Math.random()*20)+1;
    const picked=dAdvMode==='vent'?Math.max(r1,r2):Math.min(r1,r2);
    sum=picked+dMod;
    rolls={d20:[r1,r2]};
    diceStr=`1d20 ${dAdvMode==='vent'?'Ventaja':'Desventaja'}${modStr}`;
    meshList=['d20','d20'];
  } else {
    Object.entries(dCount).forEach(([dt,n])=>{
      if(!n)return;
      rolls[dt]=Array.from({length:n},()=>Math.floor(Math.random()*DSIDES[dt])+1);
      sum+=rolls[dt].reduce((a,b)=>a+b,0);
    });
    diceStr=Object.entries(dCount).filter(([,n])=>n>0).map(([dt,n])=>`${n}${dt}`).join('+')+modStr;
    meshList=Object.entries(dCount).flatMap(([dt,n])=>Array(n).fill(dt));
  }
  document.getElementById('droll-result').textContent=String(sum);
  const dPlayerName=(document.getElementById('dplayer-name').value.trim())||'Anónimo';
  const selTok=S.tokens.find(t=>t.type==='player'&&t.name===dPlayerName);
  const dieColor=selTok?parseInt(selTok.color.replace('#',''),16):null;
  db.ref('sala/rolls').push({player:dPlayerName,dice:diceStr,rolls,modifier:dMod,total:sum,timestamp:Date.now(),_cid:CLIENT_ID,color:dieColor});
  db.ref('sala/rolls').orderByKey().once('value',snap=>{
    const keys=Object.keys(snap.val()||{});
    if(keys.length>20){
      const upd={};keys.slice(0,keys.length-20).forEach(k=>{upd['sala/rolls/'+k]=null;});
      db.ref().update(upd);
    }
  });
  spawnDiceMeshes(rolls,meshList,dieColor);
  dAdvMode=null;
  dMod=0;
  Object.keys(dCount).forEach(k=>dCount[k]=0);
  updateDiceDisplay();
  document.getElementById('dmod-val').textContent='0';
}

function renderDiceLog(){
  const el=document.getElementById('dlog-list');
  if(!dLog.length){el.innerHTML=`<div style="padding:8px 0;font-family:'Cinzel',serif;font-size:9px;color:rgba(180,110,30,0.5);text-align:center;letter-spacing:1px">SIN TIRADAS</div>`;return;}
  el.innerHTML=dLog.map(e=>{
    const det=Object.entries(e.rolls).map(([dt,arr])=>`${dt}:[${arr.join(',')}]`).join(' ');

      </div>
      <div class="dlog-dice-str">${e.dice}</div>
      <div class="dlog-detail-str">${det}${e.modifier?` mod:${e.modifier>0?'+':''}${e.modifier}`:''}</div>
    </div>`;
  }).join('');
}

let activeScene='escena1';
let sceneRefs={};

function clearEnemies(){
  S.tokens.filter(t=>t.type==='enemy').forEach(t=>{if(t._el)t._el.remove();});
  S.tokens=S.tokens.filter(t=>t.type!=='enemy');

function attachSceneListeners(sceneId){
  Object.values(sceneRefs).forEach(r=>r.off());sceneRefs={};
  const base='sala/scenes/'+sceneId;
  sceneRefs.terrain=db.ref(base+'/terrain');
  sceneRefs.terrain.on('value',snap=>{S.terrain=snap.val()||{};renderTerrain();});
  sceneRefs.enemies=db.ref(base+'/enemies');
  sceneRefs.enemies.on('value',snap=>{
    const data=snap.val()||{};
    clearEnemies();
    Object.values(data).forEach(e=>{S.tokens.push({...e,_el:null});});
    renderAllToks();renderList();
  });
  sceneRefs.order=db.ref(base+'/order');
  sceneRefs.order.on('value',snap=>{S.order=snap.val()||[];renderList();});
  sceneRefs.arrow=db.ref(base+'/arrow');
  sceneRefs.arrow.on('value',snap=>{
    const v=snap.val();
    if(!v){if(!drag)clearArrow();return;}
    if(v._sender===CLIENT_ID)return;
    const t=S.tokens.find(t=>t.id===v.fromId);if(!t)return;
    const sc=t.col-S.ox, sr=t.row-S.oy;
    const ec=v.toCol-S.ox, er=v.toRow-S.oy;
    arrowTarget={sc:ec,sr:er};
    drawArrow(sc,sr,ec,er);
  });
  sceneRefs.turn=db.ref(base+'/turn');
  sceneRefs.turn.on('value',snap=>{
    S.turn=snap.val()||null;
    S.selId=S.turn;
    grid.classList.toggle('measuring',!!S.selId);
    renderAllToks(); renderList();
    if(!S.selId)clearArrow();
  });
  sceneRefs.pickerStates=db.ref(base+'/pickerStates');
  sceneRefs.pickerStates.on('value',snap=>{
    const v=snap.val();if(!v)return;
    if(v.bg){pickerStates.bg=v.bg;document.getElementById('cprev-bg').style.background=hsvToHex(v.bg.h,v.bg.s,v.bg.v);}
    if(v.line){pickerStates.line=v.line;document.getElementById('cprev-line').style.background=hsvToHex(v.line.h,v.line.s,v.line.v);}
    applyGridColors();
    if(pickerTarget==='bg'||pickerTarget==='line'){const ps=pickerStates[pickerTarget];cpH=ps.h;cpS=ps.s;cpV=ps.v;drawPicker();}
  });
}

function switchScene(id){
  activeScene=id;
  clearEnemies();
  S.terrain={};S.order=[];S.turn=null;S.selId=null;
  grid.classList.remove('measuring');
  clearArrow();
  renderTerrain();renderAllToks();renderList();
  attachSceneListeners(id);
}

function bringPlayersHere(){
  let col=S.ox,row=S.oy;
  const updates={};
  S.tokens.filter(t=>t.type==='player').forEach(t=>{
    updates['sala/players/'+t.id+'/sceneId']=activeScene;
    updates['sala/players/'+t.id+'/col']=col;
    updates['sala/players/'+t.id+'/row']=row;
    col++;if(col>=S.ox+COLS){col=S.ox;row++;}
  });
  if(Object.keys(updates).length)db.ref().update(updates);
}

function initFirebase(){
  db.ref('sala/maxHp').on('value',snap=>{
    const v=snap.val();if(v==null)return;
    S.maxHp=v;document.getElementById('ihp-val').textContent=v;
  });
  db.ref('sala/pickerPlayer').on('value',snap=>{
    const v=snap.val();if(!v)return;
    pickerStates.player=v;S.selectedColor=hsvToHex(v.h,v.s,v.v);
    document.getElementById('cprev-player').style.background=S.selectedColor;
    if(pickerTarget==='player'){cpH=v.h;cpS=v.s;cpV=v.v;drawPicker();}
  });
  db.ref('sala/players').on('value',snap=>{
    const data=snap.val()||{};
    S.tokens.filter(t=>t.type==='player').forEach(t=>{if(!data[t.id]&&t._el)t._el.remove();});
    S.tokens=S.tokens.filter(t=>t.type!=='player'||!!data[t.id]);
    Object.values(data).forEach(p=>{
      let t=S.tokens.find(t=>t.id===p.id);
      if(!t){t={...p,_el:null};S.tokens.push(t);}
      else if(!drag||drag.id!==t.id){Object.assign(t,p);}
      renderTok(t);
    });
    renderList();
    updateDiceNameOptions();
  });
  db.ref('sala/rolls').limitToLast(20).on('child_added',snap=>{
    const r=snap.val();
    if(!dLog.find(e=>e._key===snap.key)){
      dLog.unshift({...r,_key:snap.key});
      if(dLog.length>20)dLog.pop();
      renderDiceLog();
      if(r.timestamp>PAGE_LOAD_TS&&r._cid!==CLIENT_ID){
        const ml=Object.entries(r.rolls).flatMap(([dt,arr])=>Array(arr.length).fill(dt));
        spawnDiceMeshes(r.rolls,ml,r.color??null);
      }
    }
  });
  attachSceneListeners(activeScene);
  setupPicker();
  initClassGrid();
  initGrid();
  initDiceRows();
  initDiceScene();
  renderDiceLog();
}

/* ── Fit & Fullscreen ── */
function fitApp(){
  appZoom=Math.min(window.innerWidth/APP_W, window.innerHeight/APP_H);
  document.getElementById('app').style.zoom=appZoom;
}
function toggleFullscreen(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}
  else{document.exitFullscreen?.();}
}
document.addEventListener('fullscreenchange',()=>{
  fitApp();
  const btn=document.getElementById('btn-fs');
  if(btn)btn.textContent=document.fullscreenElement?'Salir pantalla completa':'Pantalla completa';
});
window.addEventListener('resize',fitApp);

initFirebase();
fitApp();
</script>
